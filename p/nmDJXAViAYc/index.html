sharing to promote inclusivity.","label":"整理"},{"g":"phrase","en":"reinforce sth.","zh":"强化","src":"From a macro perspective, gift exchange rituals reinforce social cohesion and cultural continuity.","label":"整理"},{"g":"phrase","en":"public services","zh":"公共服务","src":"Societies that preserve meaningful gift traditions tend to exhibit stronger social support networks.","label":"整理"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"Mindful giving focuses on thoughtfulness rather than price.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, gift exchange rituals reinforce social cohesion and cultural continuity.","label":"整理"},{"g":"pattern","en":"A helps (sb.) do B","zh":"A帮助（某人）做B","src":"They help maintain community ties across generations.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, people commonly exchange gifts during festivals, birthdays, weddings and childbirth celebrations.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the essence of gift-giving lies in the emotional message, not the material worth.","label":"整理"}],"words":135,"recite":false},{"id":"bx-j9pdh5","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it hard to choose a gift?","question":"Is it hard to choose a gift?","sentences":["Choosing a gift can be cognitively demanding due to the empathic inference required.","Social cognitive psychology explains that successful gift selection depends on accurately predicting the recipient’s preferences and needs.","Materially, factors such as budget constraints and time limitations add practical difficulty.","Cognitively, the giver must engage in perspective-taking, which consumes mental energy.","This is especially challenging when the relationship is not close.","From a macro perspective, the overwhelming variety of consumer goods in modern markets contributes to decision paralysis.","However, the rise of personalised services and experience-based gifts offers new solutions.","Ultimately, a thoughtful gift does not need to be expensive.","Listening carefully to the recipient’s hints and interests simplifies the process.","Therefore, people can reduce stress by focusing on meaning over monetary value.","Retailers increasingly provide curated gift guides to assist consumers.","Societies benefit when gift-giving remains a joyful rather than burdensome activity."],"expressions":[{"en":"empathic inference","zh":"共情推测 "},{"en":"engage in perspective-taking","zh":"观点采择"},{"en":"curated gift guides","zh":"精选礼品指南 "}],"ai":false,"summary":[{"g":"phrase","en":"empathic inference","zh":"共情推测","src":"Choosing a gift can be cognitively demanding due to the empathic inference required.","label":"原文标注"},{"g":"phrase","en":"engage in perspective-taking","zh":"观点采择","src":"Cognitively, the giver must engage in perspective-taking, which consumes mental energy.","label":"原文标注"},{"g":"phrase","en":"curated gift guides","zh":"精选礼品指南","src":"Retailers increasingly provide curated gift guides to assist consumers.","label":"原文标注"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"Societies benefit when gift-giving remains a joyful rather than burdensome activity.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, the overwhelming variety of consumer goods in modern markets contributes to decision paralysis.","label":"整理"},{"g":"pattern","en":"By doing…, …","zh":"通过做……","src":"Therefore, people can reduce stress by focusing on meaning over monetary value.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, factors such as budget constraints and time limitations add practical difficulty.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, a thoughtful gift does not need to be expensive.","label":"整理"}],"words":145,"recite":false},{"id":"bx-1dpf55n","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Will people feel happy when receiving an expensive gift?","question":"Will people feel happy when receiving an expensive gift?","sentences":["The happiness derived from receiving an expensive gift is often temporary and contingent on emotional context.","Positive psychology’s emotional value weighting model suggests that recipients prioritise the giver’s thoughtfulness over monetary worth.","Materially, luxury items may elicit initial excitement, but this fades quickly.","Cognitively, overly costly gifts can induce feelings of indebtedness or discomfort, particularly if the recipient cannot reciprocate.","From a macro perspective, cultural narratives increasingly promote sentiment over price.","Many people cherish handmade or personally meaningful gifts more than expensive ones.","However, in some contexts, high-value gifts symbolise deep care or celebration.","Ultimately, sustainable happiness arises from the strength of the relationship, not the gift’s cost.","Therefore, givers should prioritise personalisation and shared experiences.","Public campaigns encouraging simple, heartfelt gifting help reduce consumerist pressures.","Societies that value emotional connection over material display foster deeper human bonds."],"expressions":[{"en":"derived from","zh":""},{"en":"contingent on","zh":""},{"en":"value weighting model","zh":"情感价值权重模型 "},{"en":"feelings of indebtedness","zh":"引发亏欠感 "},{"en":"cultural narratives","zh":"文化叙事 "}],"ai":false,"summary":[{"g":"phrase","en":"derived from","zh":"源自","src":"The happiness derived from receiving an expensive gift is often temporary and contingent on emotional context.","label":"原文标注"},{"g":"phrase","en":"contingent on","zh":"取决于","src":"The happiness derived from receiving an expensive gift is often temporary and contingent on emotional context.","label":"原文标注"},{"g":"phrase","en":"value weighting model","zh":"情感价值权重模型","src":"Positive psychology’s emotional value weighting model suggests that recipients prioritise the giver’s thoughtfulness over monetary worth.","label":"原文标注"},{"g":"phrase","en":"feelings of indebtedness","zh":"引发亏欠感","src":"Cognitively, overly costly gifts can induce feelings of indebtedness or discomfort, particularly if the recipient cannot reciprocate.","label":"原文标注"},{"g":"phrase","en":"cultural narratives","zh":"文化叙事","src":"From a macro perspective, cultural narratives increasingly promote sentiment over price.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, cultural narratives increasingly promote sentiment over price.","label":"整理"},{"g":"pattern","en":"A helps (sb.) do B","zh":"A帮助（某人）做B","src":"Public campaigns encouraging simple, heartfelt gifting help reduce consumerist pressures.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, luxury items may elicit initial excitement, but this fades quickly.","label":"整理"}],"words":138,"recite":false},{"id":"bx-1k1wmy3","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Which do people give on traditional festivals, red envelo…","question":"Which do people give on traditional festivals, red envelopes or other kinds of gifts?","sentences":["During traditional festivals, the choice between red envelopes and physical gifts reflects the cultural symbol transmission model.","Cultural anthropology notes that red envelopes carry deep symbolic meanings, representing blessings, prosperity and good fortune.","Materially, they offer recipients the flexibility to purchase what they need.","Cognitively, the act of giving money symbolises sharing wealth and positive energy.","From a macro perspective, this tradition adapts well to modern economies while preserving cultural identity.","However, physical gifts remain popular for their tangible and personal nature.","Many people combine both, giving red envelopes to elders and children while exchanging carefully chosen items with peers.","Ultimately, the essence lies in the festive spirit rather than the form.","Therefore, both practices coexist harmoniously.","Educational initiatives help younger generations understand the cultural significance behind these customs.","Societies that maintain such traditions strengthen intergenerational bonds."],"expressions":[{"en":"symbol transmission model","zh":"文化符号传递模型"},{"en":"festive spirit","zh":"节日氛围 "},{"en":"Educational initiatives","zh":"教育举措 "}],"ai":false,"summary":[{"g":"phrase","en":"symbol transmission model","zh":"文化符号传递模型","src":"During traditional festivals, the choice between red envelopes and physical gifts reflects the cultural symbol transmission model.","label":"原文标注"},{"g":"phrase","en":"festive spirit","zh":"节日氛围","src":"Ultimately, the essence lies in the festive spirit rather than the form.","label":"原文标注"},{"g":"phrase","en":"Educational initiatives","zh":"教育举措","src":"Educational initiatives help younger generations understand the cultural significance behind these customs.","label":"原文标注"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"Ultimately, the essence lies in the festive spirit rather than the form.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, this tradition adapts well to modern economies while preserving cultural identity.","label":"整理"},{"g":"pattern","en":"A helps (sb.) do B","zh":"A帮助（某人）做B","src":"Educational initiatives help younger generations understand the cultural significance behind these customs.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, they offer recipients the flexibility to purchase what they need.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the essence lies in the festive spirit rather than the form.","label":"整理"}],"words":137,"recite":false},{"id":"bx-ngevgt","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What do people usually consider when buying gifts?","question":"What do people usually consider when buying gifts?","sentences":["When purchasing gifts, people primarily engage in need matching,","aligning the gift’s attributes with the recipient’s preferences and the nature of their relationship.","Consumer behaviour studies identify several key considerations.","Materially, budget constraints and product quality are practical starting points.","Cognitively, givers assess the recipient’s age, hobbies and personal tastes.","The level of intimacy between giver and receiver also guides the choice.","From a macro perspective, cultural norms and social expectations shape what is deemed appropriate.","For instance, some occasions call for symbolic items rather than utilitarian ones.","However, the most successful gifts reflect genuine understanding and care.","Ultimately, thoughtful consideration enhances the emotional impact.","Therefore, people should invest time in learning about the recipient’s current interests.","Digital platforms now offer tools to create personalised gifts.","Societies that value mindful giving strengthen social fabric."],"expressions":[{"en":"cultural norms","zh":"文化规范 "},{"en":"strengthen social fabric","zh":"社会结构"}],"ai":false,"summary":[{"g":"phrase","en":"cultural norms","zh":"文化规范","src":"From a macro perspective, cultural norms and social expectations shape what is deemed appropriate.","label":"原文标注"},{"g":"phrase","en":"strengthen social fabric","zh":"社会结构","src":"Societies that value mindful giving strengthen social fabric.","label":"原文标注"},{"g":"phrase","en":"enhance sth.","zh":"提升","src":"Ultimately, thoughtful consideration enhances the emotional impact.","label":"整理"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"For instance, some occasions call for symbolic items rather than utilitarian ones.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, cultural norms and social expectations shape what is deemed appropriate.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, thoughtful consideration enhances the emotional impact.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, budget constraints and product quality are practical starting points.","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance, some occasions call for symbolic items rather than utilitarian ones.","label":"整理"}],"words":134,"recite":false},{"id":"bx-1k7z3ub","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Are there any unlucky things that people should not buy a…","question":"Are there any unlucky things that people should not buy as gifts in your country?","sentences":["In Chinese culture, certain items are avoided as gifts due to the cultural taboo avoidance model.","Folkloric studies document how linguistic homophones and symbolic associations create negative connotations.","Materially, clocks, umbrellas and pears are commonly shunned.","Clocks sound like “attending a funeral” in Chinese; umbrellas and pears share sounds related to separation.","Cognitively, giving such items may unintentionally convey ill wishes, potentially harming relationships.","From a macro perspective, observing these taboos reflects social wisdom and respect for cultural heritage.","However, younger generations may view some of these beliefs with flexibility.","Ultimately, the underlying principle is to avoid causing discomfort.","Therefore, gift-givers should familiarise themselves with cultural sensitivities.","This awareness demonstrates consideration and strengthens interpersonal harmony.","Cross-cultural education helps prevent similar misunderstandings internationally.","Societies that respect traditions while adapting to modern values maintain cultural vitality."],"expressions":[{"en":"taboo avoidance model","zh":"文化禁忌规避模型"},{"en":"Folkloric studies","zh":"民俗研究 "},{"en":"how linguistic homophones","zh":"语言同音词 "}],"ai":false,"summary":[{"g":"phrase","en":"taboo avoidance model","zh":"文化禁忌规避模型","src":"In Chinese culture, certain items are avoided as gifts due to the cultural taboo avoidance model.","label":"原文标注"},{"g":"phrase","en":"Folkloric studies","zh":"民俗研究","src":"Folkloric studies document how linguistic homophones and symbolic associations create negative connotations.","label":"原文标注"},{"g":"phrase","en":"how linguistic homophones","zh":"语言同音词","src":"Folkloric studies document how linguistic homophones and symbolic associations create negative connotations.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, observing these taboos reflects social wisdom and respect for cultural heritage.","label":"整理"},{"g":"pattern","en":"A helps (sb.) do B","zh":"A帮助（某人）做B","src":"Cross-cultural education helps prevent similar misunderstandings internationally.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, the underlying principle is to avoid causing discomfort.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, clocks, umbrellas and pears are commonly shunned.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the underlying principle is to avoid causing discomfort.","label":"整理"}],"words":134,"recite":false},{"id":"bx-13aln54","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What can we do to leave a good impression on people we me…","question":"What can we do to leave a good impression on people we meet for the first time?","sentences":["Creating a positive first impression is effectively managed through the first impression management model.","Social psychology’s research on primacy effects shows that initial encounters heavily influence long-term perceptions.","Materially, appropriate attire and good grooming signal respect and self-discipline.","Maintaining comfortable eye contact conveys confidence.","Cognitively, active listening and genuine smiles foster immediate rapport.","Remembering and using the other person’s name enhances connection.","From a macro perspective, positive first impressions facilitate social trust and collaborative opportunities.","They contribute to smoother interpersonal and professional interactions.","However, authenticity remains crucial.","Forced behaviours can appear insincere.","Ultimately, the goal is to present one’s best self while remaining genuine.","Therefore, individuals can practise these skills to improve social outcomes.","Workplace training often includes modules on professional first impressions.","Societies benefit when citizens engage in respectful, positive initial interactions."],"expressions":[{"en":"engage in","zh":""},{"en":"impression management model","zh":"首因效应管理模型"},{"en":"primacy effects","zh":"首因效应 "},{"en":"influence long-term perceptions","zh":"长期认知"},{"en":"appropriate attire","zh":"得体的着装 "}],"ai":false,"summary":[{"g":"phrase","en":"engage in","zh":"参与","src":"Societies benefit when citizens engage in respectful, positive initial interactions.","label":"原文标注"},{"g":"phrase","en":"impression management model","zh":"首因效应管理模型","src":"Creating a positive first impression is effectively managed through the first impression management model.","label":"原文标注"},{"g":"phrase","en":"primacy effects","zh":"首因效应","src":"Social psychology’s research on primacy effects shows that initial encounters heavily influence long-term perceptions.","label":"原文标注"},{"g":"phrase","en":"influence long-term perceptions","zh":"长期认知","src":"Social psychology’s research on primacy effects shows that initial encounters heavily influence long-term perceptions.","label":"原文标注"},{"g":"phrase","en":"appropriate attire","zh":"得体的着装","src":"Materially, appropriate attire and good grooming signal respect and self-discipline.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, positive first impressions facilitate social trust and collaborative opportunities.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, the goal is to present one’s best self while remaining genuine.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, appropriate attire and good grooming signal respect and self-discipline.","label":"整理"}],"words":133,"recite":false},{"id":"bx-85xhl3","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What should we not talk about when we meet a person for t…","question":"What should we not talk about when we meet a person for the first time?","sentences":["Navigating first meetings successfully requires respecting the social boundary model.","Communication psychology advises avoiding sensitive or private topics that may trigger defensiveness.","Materially, inquiries about income, age or marital status are generally inappropriate.","Cognitively, discussing controversial subjects like politics or religion risks immediate conflict.","From a macro perspective, observing these boundaries reflects cultural sophistication and social etiquette.","It helps maintain a harmonious atmosphere.","However, completely avoiding personal topics can make conversations feel superficial.","The key is progressing gradually from neutral subjects like hobbies or travel.","Ultimately, respectful restraint during initial encounters builds a foundation for deeper connections.","Therefore, individuals should cultivate topic awareness.","Intercultural training programmes often highlight these universal principles.","Societies that value polite initial interactions foster more inclusive environments."],"expressions":[{"en":"reflects cultural sophistication","zh":"文化素养 "},{"en":"social etiquette","zh":"社会礼仪"}],"ai":false,"summary":[{"g":"phrase","en":"reflects cultural sophistication","zh":"文化素养","src":"From a macro perspective, observing these boundaries reflects cultural sophistication and social etiquette.","label":"原文标注"},{"g":"phrase","en":"social etiquette","zh":"社会礼仪","src":"From a macro perspective, observing these boundaries reflects cultural sophistication and social etiquette.","label":"原文标注"},{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"Societies that value polite initial interactions foster more inclusive environments.","label":"整理"},{"g":"pattern","en":"A makes B feel…","zh":"A让B感觉……","src":"However, completely avoiding personal topics can make conversations feel superficial.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, observing these boundaries reflects cultural sophistication and social etiquette.","label":"整理"},{"g":"pattern","en":"A helps (sb.) do B","zh":"A帮助（某人）做B","src":"It helps maintain a harmonious atmosphere.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, inquiries about income, age or marital status are generally inappropriate.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, respectful restraint during initial encounters builds a foundation for deeper connections.","label":"整理"}],"words":121,"recite":false},{"id":"bx-18v667f","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"How do people make friends in China?","question":"How do people make friends in China?","sentences":["Friendship formation in China typically follows the guanxi progressive model, characterised by gradual trust-building.","Social psychology research on Chinese interpersonal relationships highlights the importance of shared contexts.","Materially, friendships often begin among classmates, colleagues or neighbours.","Regular, face-to-face interactions provide opportunities for familiarity.","Cognitively, common interests and mutual assistance deepen emotional bonds over time.","From a macro perspective, collectivist cultural values prioritise long-term, reciprocal relationships.","Trust is earned through consistent, reliable behaviour.","However, modern digital platforms have introduced new avenues for instant connection.","Ultimately, the core principle remains sincerity and patience.","Therefore, newcomers to Chinese society should invest time in nurturing relationships.","Community events and hobby groups facilitate natural bonding.","Societies that value deep, enduring friendships tend to have stronger social support systems."],"expressions":[{"en":"guanxi progressive model","zh":"关系渐进模型"},{"en":"collectivist cultural values","zh":"集体主义文化价值观 "},{"en":"reciprocal relationships","zh":"互惠关系"}],"ai":false,"summary":[{"g":"phrase","en":"guanxi progressive model","zh":"关系渐进模型","src":"Friendship formation in China typically follows the guanxi progressive model, characterised by gradual trust-building.","label":"原文标注"},{"g":"phrase","en":"collectivist cultural values","zh":"集体主义文化价值观","src":"From a macro perspective, collectivist cultural values prioritise long-term, reciprocal relationships.","label":"原文标注"},{"g":"phrase","en":"reciprocal relationships","zh":"互惠关系","src":"From a macro perspective, collectivist cultural values prioritise long-term, reciprocal relationships.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, collectivist cultural values prioritise long-term, reciprocal relationships.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, the core principle remains sincerity and patience.","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"However, modern digital platforms have introduced new avenues for instant connection.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, friendships often begin among classmates, colleagues or neighbours.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the core principle remains sincerity and patience.","label":"整理"}],"words":123,"recite":false},{"id":"bx-1ab1mq4","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"On what occasions do people like to make friends?","question":"On what occasions do people like to make friends?","sentences":["People are most inclined to form friendships in environments described by the social field model.","Environmental psychology indicates that shared physical spaces and common purposes lower social barriers.","Materially, schools, workplaces, hobby clubs and community events serve as prime settings.","These venues facilitate repeated, natural interactions.","Cognitively, shared goals or interests provide immediate conversation starters, reducing the awkwardness of initial encounters.","From a macro perspective, such occasions contribute to the accumulation of social capital.","They build community resilience.","However, the quality of resulting friendships varies.","Some remain situational, while others deepen into lasting bonds.","Ultimately, the best occasions combine regular contact with positive emotional experiences.","Therefore, individuals seeking to expand their social circles should participate in group activities aligned with their passions.","Urban planning that creates welcoming public spaces encourages these interactions.","Societies with vibrant community life report higher levels of happiness."],"expressions":[{"en":"inclined to","zh":""},{"en":"social field model","zh":"社交场域模型"}],"ai":false,"summary":[{"g":"phrase","en":"inclined to","zh":"倾向于","src":"People are most inclined to form friendships in environments described by the social field model.","label":"原文标注"},{"g":"phrase","en":"social field model","zh":"社交场域模型","src":"People are most inclined to form friendships in environments described by the social field model.","label":"原文标注"},{"g":"phrase","en":"contribute to","zh":"促成，有助于","src":"From a macro perspective, such occasions contribute to the accumulation of social capital.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, such occasions contribute to the accumulation of social capital.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, the best occasions combine regular contact with positive emotional experiences.","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"However, the quality of resulting friendships varies.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, schools, workplaces, hobby clubs and community events serve as prime settings.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the best occasions combine regular contact with positive emotional experiences.","label":"整理"}],"words":142,"recite":false},{"id":"bx-1cygpwt","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it important to have the same hobbies and interests wh…","question":"Is it important to have the same hobbies and interests when making friends?","sentences":["Shared hobbies facilitate friendship formation through the homophily attraction model, but they are not an absolute prerequisite.","Social psychology confirms that similarity in interests provides ready-made activities and conversation topics.","Materially, common hobbies enable friends to spend quality time together, strengthening bonds.","Cognitively, shared passions enhance mutual understanding and reduce friction.","From a macro perspective, however, diverse friendship circles expose individuals to different perspectives, fostering personal growth and tolerance.","Complementary personalities can also create balanced, supportive relationships.","Ultimately, the foundation of friendship lies in mutual respect, trust and emotional support.","Therefore, while shared interests are beneficial, they should not be the sole criterion.","Embracing friends with different hobbies enriches life experiences.","Educational programmes promoting diversity teach the value of varied friendships.","Societies that celebrate both similarity and difference build more cohesive communities."],"expressions":[{"en":"homophily attraction model","zh":"同质性吸引模型"},{"en":"Complementary personalities","zh":"互补型人格 "},{"en":"more cohesive communities","zh":"有凝聚力的社区"}],"ai":false,"summary":[{"g":"phrase","en":"homophily attraction model","zh":"同质性吸引模型","src":"Shared hobbies facilitate friendship formation through the homophily attraction model, but they are not an absolute prerequisite.","label":"原文标注"},{"g":"phrase","en":"Complementary personalities","zh":"互补型人格","src":"Complementary personalities can also create balanced, supportive relationships.","label":"原文标注"},{"g":"phrase","en":"more cohesive communities","zh":"有凝聚力的社区","src":"Societies that celebrate both similarity and difference build more cohesive communities.","label":"原文标注"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Therefore, while shared interests are beneficial, they should not be the sole criterion.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, however, diverse friendship circles expose individuals to different perspectives, fostering personal growth and tolerance.","label":"整理"},{"g":"pattern","en":"A allows/enables sb. to do B","zh":"A使某人能够做B","src":"Materially, common hobbies enable friends to spend quality time together, strengthening bonds.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, common hobbies enable friends to spend quality time together, strengthening bonds.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the foundation of friendship lies in mutual respect, trust and emotional support.","label":"整理"}],"words":132,"recite":false},{"id":"bx-1cabir2","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What qualities make true friends?","question":"What qualities make true friends?","sentences":["True friendship is anchored in the trust-reciprocity model, where authenticity and mutual support form the core.","Positive psychology research on high-quality relationships identifies key qualities: sincerity, empathy, respect and reliability.","Materially, genuine friends offer practical help during challenging times.","Cognitively, they practise active listening, maintain confidentiality and celebrate each other’s successes without envy.","From a macro perspective, such friendships contribute to societal well-being by creating networks of emotional security.","They buffer against mental health issues and foster community resilience.","However, true friendship requires ongoing effort and compromise from both parties.","It is not merely about convenience but deep commitment.","Ultimately, the presence of even one such friend significantly enhances life satisfaction.","Therefore, individuals should nurture these qualities in themselves to attract similar friends.","School curricula increasingly include social-emotional learning to develop these traits.","Societies that value authentic friendships cultivate greater collective happiness."],"expressions":[{"en":"is anchored in","zh":""},{"en":"buffer against","zh":""},{"en":"anchored in","zh":"建立在 "},{"en":"trust-reciprocity model","zh":"信任互惠模型"},{"en":"maintain confidentiality","zh":"保密 "}],"ai":false,"summary":[{"g":"phrase","en":"is anchored in","zh":"扎根于","src":"True friendship is anchored in the trust-reciprocity model, where authenticity and mutual support form the core.","label":"原文标注"},{"g":"phrase","en":"buffer against","zh":"缓冲，抵御","src":"They buffer against mental health issues and foster community resilience.","label":"原文标注"},{"g":"phrase","en":"anchored in","zh":"建立在","src":"True friendship is anchored in the trust-reciprocity model, where authenticity and mutual support form the core.","label":"原文标注"},{"g":"phrase","en":"trust-reciprocity model","zh":"信任互惠模型","src":"True friendship is anchored in the trust-reciprocity model, where authenticity and mutual support form the core.","label":"原文标注"},{"g":"phrase","en":"maintain confidentiality","zh":"保密","src":"Cognitively, they practise active listening, maintain confidentiality and celebrate each other’s successes without envy.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, such friendships contribute to societal well-being by creating networks of emotional security.","label":"整理"},{"g":"pattern","en":"A helps (sb.) do B","zh":"A帮助（某人）做B","src":"Materially, genuine friends offer practical help during challenging times.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, genuine friends offer practical help during challenging times.","label":"整理"}],"words":142,"recite":false},{"id":"bx-cen99r","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"31: What do people need to remember in their daily lives?","question":"31: What do people need to remember in their daily lives?","sentences":["What people need to remember in daily life is primarily determined by cognitive filtering mechanisms.","Cognitive psychology suggests that our brains selectively encode information with high survival relevance or emotional significance,","while automatically discarding trivial details.","For instance,","individuals are far more likely to recall a friend’s act of kindness or an urgent work deadline than the specific background noise of a café.","From a material perspective,","people rely on external tools like smartphones and digital calendars to manage practical tasks such as paying bills or attending appointments.","This offloading of memory reduces cognitive load and enhances daily efficiency.","Cognitively, remembering values like gratitude and empathy fosters mental resilience and strengthens social bonds.","At a macro level, these individual habits contribute to broader social cohesion;","when citizens collectively remember cultural traditions and historical lessons, it reinforces national identity and intergenerational continuity.","However, over-reliance on digital aids may weaken natural memory capacity.","Ultimately, a balanced approach—combining external reminders with internal mindfulness—is essential.","Therefore, people should prioritize remembering what truly matters: meaningful relationships, core responsibilities, and lessons that promote personal growth.","Modern society benefits immensely when individuals cultivate both practical memory skills and emotional awareness."],"expressions":[{"en":"cognitive filtering mechanisms","zh":"认知过滤模型"},{"en":"high survival relevance","zh":"高生存相关性 "},{"en":"offloading of memory","zh":"记忆卸载 "},{"en":"intergenerational continuity","zh":"代际延续性"}],"ai":false,"summary":[{"g":"phrase","en":"cognitive filtering mechanisms","zh":"认知过滤模型","src":"What people need to remember in daily life is primarily determined by cognitive filtering mechanisms.","label":"原文标注"},{"g":"phrase","en":"high survival relevance","zh":"高生存相关性","src":"Cognitive psychology suggests that our brains selectively encode information with high survival relevance or emotional significance,","label":"原文标注"},{"g":"phrase","en":"offloading of memory","zh":"记忆卸载","src":"This offloading of memory reduces cognitive load and enhances daily efficiency.","label":"原文标注"},{"g":"phrase","en":"intergenerational continuity","zh":"代际延续性","src":"when citizens collectively remember cultural traditions and historical lessons, it reinforces national identity and intergenerational continuity.","label":"原文标注"},{"g":"pattern","en":"… is (largely) determined by…","zh":"……（主要）由……决定","src":"What people need to remember in daily life is primarily determined by cognitive filtering mechanisms.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective,","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance,","label":"整理"},{"g":"idiom","en":"essential → a must","zh":"必不可少（口语替换）","src":"Ultimately, a balanced approach—combining external reminders with internal mindfulness—is essential.","label":"整理"}],"words":193,"recite":false},{"id":"bx-518yqd","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"32: What can we learn from history?","question":"32: What can we learn from history?","sentences":["History serves as a vast repository of patterns that humanity can learn from to navigate the future.","The Pattern Recognition Model in historiography suggests that events often repeat in cyclical ways due to consistent human behaviors and societal structures.","For example,","studying the economic policies of the Great Depression helps modern governments design safer financial systems to prevent similar crises.","From a material perspective,","history teaches us about technological evolution—how past innovations in agriculture or transport laid the groundwork for today’s advancements.","Cognitively, engaging with history cultivates critical thinking and empathy; by understanding the struggles of previous generations,","we develop a deeper appreciation for peace and progress.","At a macro level, nations use historical lessons to shape diplomatic strategies and domestic policies, ensuring stability and growth.","Yet, history can also be misinterpreted or oversimplified, leading to biased conclusions.","Ultimately, the value of history lies not in memorizing dates,","but in extracting timeless principles about human nature and societal dynamics.","Therefore, we should approach history with an analytical mind, using its patterns to build a more informed, compassionate,","and resilient world."],"expressions":[{"en":"laid the groundwork","zh":"奠定了基础 "},{"en":"misinterpreted or oversimplified","zh":"被误解或过度简化"},{"en":"extracting timeless principles","zh":"提炼永恒原则 "}],"ai":false,"summary":[{"g":"phrase","en":"laid the groundwork","zh":"奠定了基础","src":"history teaches us about technological evolution—how past innovations in agriculture or transport laid the groundwork for today’s advancements.","label":"原文标注"},{"g":"phrase","en":"misinterpreted or oversimplified","zh":"被误解或过度简化","src":"Yet, history can also be misinterpreted or oversimplified, leading to biased conclusions.","label":"原文标注"},{"g":"phrase","en":"extracting timeless principles","zh":"提炼永恒原则","src":"but in extracting timeless principles about human nature and societal dynamics.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, nations use historical lessons to shape diplomatic strategies and domestic policies, ensuring stability and growth.","label":"整理"},{"g":"pattern","en":"A helps (sb.) do B","zh":"A帮助（某人）做B","src":"studying the economic policies of the Great Depression helps modern governments design safer financial systems to prevent similar crises.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the value of history lies not in memorizing dates,","label":"整理"},{"g":"idiom","en":"Therefore → So,","zh":"所以（口语里更常用 So）","src":"Therefore, we should approach history with an analytical mind, using its patterns to build a more informed, compassionate,","label":"整理"}],"words":180,"recite":false},{"id":"bx-1sdk4hg","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"33: Why do some people have a better memory than others?","question":"33: Why do some people have a better memory than others?","sentences":["Memory capabilities vary significantly among individuals due to differences in neuroplasticity —the brain’s ability to reorganize itself by forming new neural connections.","Neuroscience indicates that this variance stems from a combination of genetic predisposition, environmental stimulation, and lifestyle choices.","For instance, people who engage in regular aerobic exercise and quality sleep tend to have a larger hippocampus,","the brain region crucial for memory consolidation.","From a material perspective, factors like nutrition and exposure to toxins also play a role in cognitive health.","Cognitively, individuals who employ active learning strategies—such as mnemonics, spaced repetition, or teaching others—often outperform their peers in retention tasks.","Education systems that emphasize critical thinking over rote learning further enhance these skills.","At a macro level,","societies that prioritize public health and lifelong learning create environments where memory potential can flourish across all age groups.","However, it is important to note that memory is not fixed; with targeted training and healthy habits,","almost anyone can improve.","Ultimately, understanding these variables empowers us to take charge of our cognitive fitness,","proving that a better memory is as much a product of nurture as it is of nature."],"expressions":[{"en":"take charge of","zh":""},{"en":"differences in neuroplasticity","zh":"神经可塑性—"},{"en":"genetic predisposition","zh":"遗传易感性"},{"en":"regular aerobic exercise","zh":"规律有氧运动 "},{"en":"larger hippocampus","zh":"海马体"}],"ai":false,"summary":[{"g":"phrase","en":"take charge of","zh":"掌控，负责","src":"Ultimately, understanding these variables empowers us to take charge of our cognitive fitness,","label":"原文标注"},{"g":"phrase","en":"differences in neuroplasticity","zh":"神经可塑性—","src":"Memory capabilities vary significantly among individuals due to differences in neuroplasticity —the brain’s ability to reorganize itself by forming new neural connections.","label":"原文标注"},{"g":"phrase","en":"genetic predisposition","zh":"遗传易感性","src":"Neuroscience indicates that this variance stems from a combination of genetic predisposition, environmental stimulation, and lifestyle choices.","label":"原文标注"},{"g":"phrase","en":"regular aerobic exercise","zh":"规律有氧运动","src":"For instance, people who engage in regular aerobic exercise and quality sleep tend to have a larger hippocampus,","label":"原文标注"},{"g":"phrase","en":"larger hippocampus","zh":"海马体","src":"For instance, people who engage in regular aerobic exercise and quality sleep tend to have a larger hippocampus,","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, factors like nutrition and exposure to toxins also play a role in cognitive health.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level,","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance, people who engage in regular aerobic exercise and quality sleep tend to have a larger hippocampus,","label":"整理"}],"words":189,"recite":false},{"id":"bx-1j22xup","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"34: Do people like things of memorial significance?","question":"34: Do people like things of memorial significance?","sentences":["People generally have a strong affinity for items of memorial significance because these objects serve as emotional anchors,","providing a sense of continuity in an ever-changing world.","The Emotional Continuity Model in psychology explains that such items help individuals maintain a coherent life narrative,","especially during times of transition or loss.","For example, a grandmother’s ring or a childhood toy can evoke powerful feelings of belonging and comfort,","linking the past to the present.","From a material perspective, these objects are often preserved with great care, sometimes becoming family heirlooms that transcend generations.","Cognitively, engaging with memorial items triggers nostalgia, which research shows can boost mood, increase social connectedness,","and provide meaning in life.","At a macro level, the collective cherishing of memorial artifacts contributes to cultural heritage and national identity,","as seen in museums and public memorials.","Yet, an excessive attachment to material mementos might sometimes hinder emotional moving-on.","Ultimately, these items are valued not for their monetary worth, but for the intangible stories and emotions they encapsulate.","Therefore, they play a vital role in human psychological well-being and the transmission of values across time."],"expressions":[{"en":"becoming family heirlooms","zh":"家族传家宝 "},{"en":"material mementos","zh":"过度执着物质纪念品"},{"en":"Encapsulate****","zh":"to express or show the most important facts about something"}],"ai":false,"summary":[{"g":"phrase","en":"becoming family heirlooms","zh":"家族传家宝","src":"From a material perspective, these objects are often preserved with great care, sometimes becoming family heirlooms that transcend generations.","label":"原文标注"},{"g":"phrase","en":"material mementos","zh":"过度执着物质纪念品","src":"Yet, an excessive attachment to material mementos might sometimes hinder emotional moving-on.","label":"原文标注"},{"g":"phrase","en":"contribute to","zh":"促成，有助于","src":"At a macro level, the collective cherishing of memorial artifacts contributes to cultural heritage and national identity,","label":"整理"},{"g":"pattern","en":"…, especially when…","zh":"尤其是当……","src":"especially during times of transition or loss.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, these objects are often preserved with great care, sometimes becoming family heirlooms that transcend generations.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, the collective cherishing of memorial artifacts contributes to cultural heritage and national identity,","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, these items are valued not for their monetary worth, but for the intangible stories and emotions they encapsulate.","label":"整理"},{"g":"idiom","en":"Therefore → So,","zh":"所以（口语里更常用 So）","src":"Therefore, they play a vital role in human psychological well-being and the transmission of values across time.","label":"整理"}],"words":186,"recite":false},{"id":"bx-w9p5n2","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"35: Which can help people remember things better, words o…","question":"35: Which can help people remember things better, words or photos?","sentences":["When it comes to enhancing memory,","photos often have an edge over... words due to the Dual Coding Model,","which posits that visual and verbal information are processed through distinct but interconnected channels in the brain.","Images directly stimulate the visual cortex, creating rich, multi-sensory memory traces that are easier to retrieve than abstract linguistic codes.","For instance,","a photograph of a beach sunset is likely to evoke stronger emotional and sensory recall than a written description of the same scene.","From a material perspective, photos serve as compact, shareable external memory aids,","while words require more cognitive effort to decode and internalize.","Cognitively, combining both—such as pairing a diagram with explanatory text—yields the best results, as it engages multiple brain regions simultaneously.","At a macro level, this understanding has transformed education and communication,","with infographics and visual storytelling becoming powerful tools for public engagement.","However, words remain indispensable for conveying complex, abstract ideas that images alone cannot capture.","Ultimately, while photos excel at triggering immediate, emotional memories,","an integrated approach that leverages both modalities is the most effective strategy for deep, lasting learning."],"expressions":[{"en":"have an edge over","zh":""},{"en":"visual cortex","zh":"视觉皮质"},{"en":"Compact****","zh":"consisting of parts that are positioned together closely or in a tidy way, using very litt"}],"ai":false,"summary":[{"g":"phrase","en":"have an edge over","zh":"比……有优势","src":"photos often have an edge over... words due to the Dual Coding Model,","label":"原文标注"},{"g":"phrase","en":"visual cortex","zh":"视觉皮质","src":"Images directly stimulate the visual cortex, creating rich, multi-sensory memory traces that are easier to retrieve than abstract linguistic codes.","label":"原文标注"},{"g":"phrase","en":"enhance sth.","zh":"提升","src":"When it comes to enhancing memory,","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Ultimately, while photos excel at triggering immediate, emotional memories,","label":"整理"},{"g":"pattern","en":"When it comes to…, …","zh":"说到……","src":"When it comes to enhancing memory,","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, photos serve as compact, shareable external memory aids,","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance,","label":"整理"},{"g":"idiom","en":"distinct → different","zh":"不同的（口语替换）","src":"which posits that visual and verbal information are processed through distinct but interconnected channels in the brain.","label":"整理"}],"words":184,"recite":false},{"id":"bx-z239hm","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"36: Can technology help people remember things better? How?","question":"36: Can technology help people remember things better? How?","sentences":["Technology can significantly enhance human memory through what researchers call the External Memory Aid Model.","By offloading information onto digital devices, individuals reduce cognitive load and free up mental resources for higher-order thinking.","For example, smartphone calendar alerts ensure we never miss medical appointments,","while cloud storage preserves vast amounts of data that would otherwise be forgotten.","From a material perspective, these tools offer reliable, searchable repositories accessible across multiple devices, effectively extending our biological memory capacity.","Cognitively, technology employs multimodal cues—such as visual notifications and auditory alarms—to reinforce memory traces, making recall faster and more accurate.","However, over-reliance on digital aids may lead to “digital amnesia,” where people forget information easily retrievable online.","At a macro level, societies that integrate these tools thoughtfully can achieve greater productivity and inclusivity,","as seen in assistive technologies for dementia patients or educational apps that personalize learning.","Ultimately, technology should be viewed as a complementary partner to our natural memory systems.","When used mindfully, it empowers us to remember what truly matters while automating routine retention tasks."],"expressions":[{"en":"Memory Aid Model","zh":"外部记忆辅助模型"},{"en":"digital amnesia","zh":"数字性遗忘"},{"en":"From a material perspective","zh":""}],"ai":false,"summary":[{"g":"phrase","en":"Memory Aid Model","zh":"外部记忆辅助模型","src":"Technology can significantly enhance human memory through what researchers call the External Memory Aid Model.","label":"原文标注"},{"g":"phrase","en":"digital amnesia","zh":"数字性遗忘","src":"However, over-reliance on digital aids may lead to “digital amnesia,” where people forget information easily retrievable online.","label":"原文标注"},{"g":"phrase","en":"From a material perspective","zh":"从物质层面来看","src":"From a material perspective, these tools offer reliable, searchable repositories accessible across multiple devices, effectively extending our biological memory capacity.","label":"原文标注"},{"g":"pattern","en":"If…; otherwise, …","zh":"如果……；否则……","src":"while cloud storage preserves vast amounts of data that would otherwise be forgotten.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, these tools offer reliable, searchable repositories accessible across multiple devices, effectively extending our biological memory capacity.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, societies that integrate these tools thoughtfully can achieve greater productivity and inclusivity,","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, technology should be viewed as a complementary partner to our natural memory systems.","label":"整理"},{"g":"idiom","en":"However → But then again,","zh":"不过话说回来（口语替换）","src":"However, over-reliance on digital aids may lead to “digital amnesia,” where people forget information easily retrievable online.","label":"整理"}],"words":174,"recite":false},{"id":"bx-11iiyjb","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"37: What kind of topics do young people like to talk abou…","question":"37: What kind of topics do young people like to talk about today?","sentences":["The topics young people gravitate toward today are best understood through the Identity Construction Model,","which suggests that conversations are a primary means of exploring and asserting one’s place in the world.","Social psychology observes that adolescents and young adults use discourse to test values, build peer bonds, and signal group membership.","Commonly discussed subjects include personal growth, mental health awareness, sustainable living, and digital trends.","From a material perspective, conversations often revolve around consumer choices like fashion brands or the latest gadgets,","reflecting both self-expression and economic agency.","Cognitively, young people increasingly engage with complex issues such as climate change and social justice,","demonstrating a blend of idealism and pragmatism.","At a macro level, social media platforms amplify these interests, creating global echo chambers that both unite and polarize.","While critics worry about superficiality, many young people use these topics to develop empathy and civic responsibility.","Ultimately, their conversational preferences reveal a generation that values authenticity, interconnectedness, and positive change.","By listening to these dialogues, society gains insight into the evolving priorities of its future leaders."],"expressions":[{"en":"Identity Construction Model","zh":"身份构建模型"},{"en":"test values","zh":"运用话语来检验价值观"},{"en":"signal group membership","zh":"表明群体归属"},{"en":"economic agency","zh":"经济能动性"},{"en":"global echo chambers","zh":"制造全球回声室"}],"ai":false,"summary":[{"g":"phrase","en":"Identity Construction Model","zh":"身份构建模型","src":"The topics young people gravitate toward today are best understood through the Identity Construction Model,","label":"原文标注"},{"g":"phrase","en":"test values","zh":"运用话语来检验价值观","src":"Social psychology observes that adolescents and young adults use discourse to test values, build peer bonds, and signal group membership.","label":"原文标注"},{"g":"phrase","en":"signal group membership","zh":"表明群体归属","src":"Social psychology observes that adolescents and young adults use discourse to test values, build peer bonds, and signal group membership.","label":"原文标注"},{"g":"phrase","en":"economic agency","zh":"经济能动性","src":"reflecting both self-expression and economic agency.","label":"原文标注"},{"g":"phrase","en":"global echo chambers","zh":"制造全球回声室","src":"At a macro level, social media platforms amplify these interests, creating global echo chambers that both unite and polarize.","label":"原文标注"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While critics worry about superficiality, many young people use these topics to develop empathy and civic responsibility.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, conversations often revolve around consumer choices like fashion brands or the latest gadgets,","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, their conversational preferences reveal a generation that values authenticity, interconnectedness, and positive change.","label":"整理"}],"words":177,"recite":false},{"id":"bx-t3qg8i","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"38: What would happen if the listener didn’t listen caref…","question":"38: What would happen if the listener didn’t listen carefully?","sentences":["When a listener fails to listen carefully, the consequences ripple through personal and professional spheres,","a phenomenon described by the Communication Breakdown Model.","Communication studies emphasize that listening is not merely hearing words but actively processing meaning;","its absence severs the feedback loop essential for mutual understanding.","In practical terms,","this can lead to errors such as a doctor misprescribing medication due to missed symptoms or a manager derailing a project by ignoring team input.","From a material perspective, such mistakes waste time, money, and resources.","Cognitively, the speaker may experience frustration, diminished self-worth, or reluctance to share in the future,","while the listener remains unaware of the knowledge gap.","At a macro level, poor listening erodes trust within organizations and communities, potentially escalating into larger conflicts.","However, recognizing these risks encourages the cultivation of active listening skills.","Ultimately, careful listening is a cornerstone of empathy and collaboration.","By valuing others’ words, we build stronger relationships and more resilient societies."],"expressions":[{"en":"Communication Breakdown Model","zh":"沟通断裂模型"},{"en":"feedback loop","zh":"反馈回路 "},{"en":"derailing a project","zh":"使项目脱轨 "},{"en":"diminished self-worth","zh":"自我价值感降低"}],"ai":false,"summary":[{"g":"phrase","en":"Communication Breakdown Model","zh":"沟通断裂模型","src":"a phenomenon described by the Communication Breakdown Model.","label":"原文标注"},{"g":"phrase","en":"feedback loop","zh":"反馈回路","src":"its absence severs the feedback loop essential for mutual understanding.","label":"原文标注"},{"g":"phrase","en":"derailing a project","zh":"使项目脱轨","src":"this can lead to errors such as a doctor misprescribing medication due to missed symptoms or a manager derailing a project by ignoring team input.","label":"原文标注"},{"g":"phrase","en":"diminished self-worth","zh":"自我价值感降低","src":"Cognitively, the speaker may experience frustration, diminished self-worth, or reluctance to share in the future,","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, such mistakes waste time, money, and resources.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, poor listening erodes trust within organizations and communities, potentially escalating into larger conflicts.","label":"整理"},{"g":"idiom","en":"emphasise → stress","zh":"强调（口语替换）","src":"Communication studies emphasize that listening is not merely hearing words but actively processing meaning;","label":"整理"},{"g":"idiom","en":"essential → a must","zh":"必不可少（口语替换）","src":"its absence severs the feedback loop essential for mutual understanding.","label":"整理"}],"words":160,"recite":false},{"id":"bx-yzdkqx","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"39: How can we tell if a listener is listening carefully?","question":"39: How can we tell if a listener is listening carefully?","sentences":["Determining whether a listener is truly engaged relies on observing the Feedback Loop Model,","where verbal and nonverbal cues signal active information processing.","Social linguistics research shows that effective listeners provide continuous, subtle feedback that encourages the speaker and confirms comprehension.","Physically, this includes maintaining appropriate eye contact, nodding in agreement, and leaning slightly forward—behaviors that unconsciously communicate attentiveness.","Cognitively, a careful listener asks clarifying questions, paraphrases key points,","and offers empathetic responses that demonstrate deep understanding rather than mere passive reception.","For instance, a teacher who rephrases a student’s query before answering shows genuine engagement.","At a macro level, such feedback loops strengthen social bonds, improve workplace productivity, and foster inclusive educational environments.","Conversely, distractions like smartphone use or interrupting disrupt this loop, leading to feelings of invalidation.","Ultimately, the ability to read these signals is vital for building trust and cooperation.","By honing our own feedback behaviors,","we not only become better listeners but also contribute to a culture of mutual respect and meaningful dialogue."],"expressions":[{"en":"Physically","zh":""}],"ai":false,"summary":[{"g":"phrase","en":"Physically","zh":"从身体上","src":"Physically, this includes maintaining appropriate eye contact, nodding in agreement, and leaning slightly forward—behaviors that unconsciously communicate attentiveness.","label":"原文标注"},{"g":"phrase","en":"contribute to","zh":"促成，有助于","src":"we not only become better listeners but also contribute to a culture of mutual respect and meaningful dialogue.","label":"整理"},{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"At a macro level, such feedback loops strengthen social bonds, improve workplace productivity, and foster inclusive educational environments.","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"we not only become better listeners but also contribute to a culture of mutual respect and meaningful dialogue.","label":"整理"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"and offers empathetic responses that demonstrate deep understanding rather than mere passive reception.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, such feedback loops strengthen social bonds, improve workplace productivity, and foster inclusive educational environments.","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance, a teacher who rephrases a student’s query before answering shows genuine engagement.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the ability to read these signals is vital for building trust and cooperation.","label":"整理"}],"words":167,"recite":false},{"id":"bx-1v3plly","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"40: Why are some people keen on taking photos?","question":"40: Why are some people keen on taking photos?","sentences":["Many individuals are passionate about photography due to the Visual Life-logging Model,","which frames photo-taking as a method of preserving fleeting moments for future reflection and sharing.","Visual psychology suggests that images serve as powerful memory anchors, often evoking stronger emotional recall than words alone.","For example,","a simple snapshot of a family gathering can instantly transport the viewer back to the laughter and warmth of that day.","From a material perspective, the ubiquity of smartphone cameras has democratized this practice,","allowing anyone to document their life story effortlessly.","Cognitively, the act of framing a shot encourages mindfulness and a deeper appreciation of one’s surroundings.","At a macro level, the collective habit of photo-taking fuels social media economies, promotes tourism, and even aids historical documentation.","However, excessive focus on capturing the perfect image can sometimes detract from living in the moment.","Ultimately, photography remains a profoundly human endeavor —a way to assert identity, celebrate beauty,","and maintain connections across time and distance.","When balanced with presence, it enriches our lives immeasurably."],"expressions":[{"en":"detract from","zh":""},{"en":"Visual Life-logging Model","zh":"视觉生活记录模型"},{"en":"preserving fleeting moments","zh":"留存转瞬即逝的瞬间 "},{"en":"democratized this practice","zh":"让这一做法普及化"},{"en":"framing a shot","zh":"取景 "}],"ai":false,"summary":[{"g":"phrase","en":"detract from","zh":"减损，降低","src":"However, excessive focus on capturing the perfect image can sometimes detract from living in the moment.","label":"原文标注"},{"g":"phrase","en":"Visual Life-logging Model","zh":"视觉生活记录模型","src":"Many individuals are passionate about photography due to the Visual Life-logging Model,","label":"原文标注"},{"g":"phrase","en":"preserving fleeting moments","zh":"留存转瞬即逝的瞬间","src":"which frames photo-taking as a method of preserving fleeting moments for future reflection and sharing.","label":"原文标注"},{"g":"phrase","en":"democratized this practice","zh":"让这一做法普及化","src":"From a material perspective, the ubiquity of smartphone cameras has democratized this practice,","label":"原文标注"},{"g":"phrase","en":"framing a shot","zh":"取景","src":"Cognitively, the act of framing a shot encourages mindfulness and a deeper appreciation of one’s surroundings.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, the ubiquity of smartphone cameras has democratized this practice,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, the collective habit of photo-taking fuels social media economies, promotes tourism, and even aids historical documentation.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, photography remains a profoundly human endeavor —a way to assert identity, celebrate beauty,","label":"整理"}],"words":171,"recite":false},{"id":"bx-10w0bis","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"41: What kind of photos do people often take?","question":"41: What kind of photos do people often take?","sentences":["The types of photos people frequently take can be understood through the Life Documentation Model,","which suggests that individuals instinctively record moments that carry emotional resonance or personal significance.","Visual sociology observes that these images serve as a visual autobiography, allowing people to revisit and share their life journeys.","Commonly captured subjects include family gatherings, pets, scenic landscapes, and culinary delights.","From a material perspective,","the proliferation of smartphone cameras has made it effortless to accumulate thousands of such images,","creating vast digital archives.","Cognitively, the act of selecting what to photograph reflects one’s values and aesthetic preferences,","reinforcing a sense of identity and belonging.","For instance, a person who frequently photographs nature may be expressing a deep connection to the environment.","At a macro level, these collective visual diaries contribute to broader cultural narratives and even influence tourism trends.","However, an over-curated feed can sometimes distort reality.","Ultimately, the photos we take are more than mere pixels; they are reflections of what we cherish most.","By consciously choosing our subjects, we craft a meaningful visual legacy that celebrates life’s beauty and diversity."],"expressions":[{"en":"carry emotional resonance","zh":"情感共鸣 "},{"en":"culinary delights","zh":"美食"},{"en":"over-curated feed","zh":"过度编排的资讯流 "},{"en":"meaningful visual legacy","zh":"视觉遗产 "}],"ai":false,"summary":[{"g":"phrase","en":"carry emotional resonance","zh":"情感共鸣","src":"which suggests that individuals instinctively record moments that carry emotional resonance or personal significance.","label":"原文标注"},{"g":"phrase","en":"culinary delights","zh":"美食","src":"Commonly captured subjects include family gatherings, pets, scenic landscapes, and culinary delights.","label":"原文标注"},{"g":"phrase","en":"over-curated feed","zh":"过度编排的资讯流","src":"However, an over-curated feed can sometimes distort reality.","label":"原文标注"},{"g":"phrase","en":"meaningful visual legacy","zh":"视觉遗产","src":"By consciously choosing our subjects, we craft a meaningful visual legacy that celebrates life’s beauty and diversity.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, these collective visual diaries contribute to broader cultural narratives and even influence tourism trends.","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance, a person who frequently photographs nature may be expressing a deep connection to the environment.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the photos we take are more than mere pixels; they are reflections of what we cherish most.","label":"整理"}],"words":183,"recite":false},{"id":"bx-4u8yju","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"42: Is it ok to take photos everywhere?","question":"42: Is it ok to take photos everywhere?","sentences":["Whether it is acceptable to take photos everywhere is best examined through the Contextual Sensitivity Model,","which emphasizes that photographic behavior must adapt to the social and cultural norms of a given environment.","Media ethics highlights that while visual documentation is a natural human impulse, certain spaces—such as hospitals,","places of worship, or private properties—demand heightened discretion to protect dignity and privacy.","From a material perspective, many institutions now post clear signage or use physical barriers to regulate photography,","reflecting a societal consensus on appropriate boundaries.","Cognitively, individuals must exercise empathy and foresight,","recognizing that their right to capture an image should not override others’ comfort or safety.","For example, photographing a vulnerable person without consent can cause distress and erode trust.","At a macro level, these considerations shape national laws and platform policies, fostering a more respectful digital culture.","Yet, an overly restrictive approach might stifle artistic expression or historical documentation.","Ultimately, the key lies in mindful balance.","By being attuned to our surroundings and prioritizing human decency over the urge to click,","we can preserve both precious memories and social harmony."],"expressions":[{"en":"Contextual Sensitivity Model","zh":"情景敏感模型"},{"en":"demand heightened discretion","zh":"更高的审慎 "},{"en":"societal consensus","zh":"社会共识 "},{"en":"stifle artistic expression","zh":"压制艺术表达 "},{"en":"being attuned to","zh":"适应于 "}],"ai":false,"summary":[{"g":"phrase","en":"Contextual Sensitivity Model","zh":"情景敏感模型","src":"Whether it is acceptable to take photos everywhere is best examined through the Contextual Sensitivity Model,","label":"原文标注"},{"g":"phrase","en":"demand heightened discretion","zh":"更高的审慎","src":"places of worship, or private properties—demand heightened discretion to protect dignity and privacy.","label":"原文标注"},{"g":"phrase","en":"societal consensus","zh":"社会共识","src":"reflecting a societal consensus on appropriate boundaries.","label":"原文标注"},{"g":"phrase","en":"stifle artistic expression","zh":"压制艺术表达","src":"Yet, an overly restrictive approach might stifle artistic expression or historical documentation.","label":"原文标注"},{"g":"phrase","en":"being attuned to","zh":"适应于","src":"By being attuned to our surroundings and prioritizing human decency over the urge to click,","label":"原文标注"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Media ethics highlights that while visual documentation is a natural human impulse, certain spaces—such as hospitals,","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, many institutions now post clear signage or use physical barriers to regulate photography,","label":"整理"},{"g":"idiom","en":"emphasise → stress","zh":"强调（口语替换）","src":"which emphasizes that photographic behavior must adapt to the social and cultural norms of a given environment.","label":"整理"}],"words":183,"recite":false},{"id":"bx-1yiuj98","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"43: Why do tourists like taking photos while they are tra…","question":"43: Why do tourists like taking photos while they are travelling?","sentences":["Tourists’ enthusiasm for photography while traveling is largely driven by the Experiential Validation Model,","wherein images serve as tangible proof and emotional extensions of their journeys.","Tourism psychology explains that taking photos helps individuals process and preserve novel experiences, transforming fleeting moments into lasting memories.","From a material perspective, capturing landmarks, local cuisines, or cultural performances provides a visual inventory of one’s adventures,","easily shareable across social networks.","Cognitively, this act fulfills a deep-seated need for self-expression and social connection;","posting travel photos often invites validation and storytelling that reinforce a sense of achievement and belonging.","For instance,","a photo of oneself at the Eiffel Tower is not just a picture but a declaration of having broadened one’s horizons.","At a macro level, this phenomenon fuels tourism industries, encourages cross-cultural understanding, and even shapes destination branding.","However, excessive focus on documentation can sometimes detract from immersive enjoyment.","Ultimately, when balanced with presence, travel photography enriches our lives by allowing us to relive and celebrate our explorations.","It is a joyful practice that bridges the personal and the universal."],"expressions":[{"en":"when balanced with presence","zh":""},{"en":"Experiential Validation Model","zh":"体验验证模型"},{"en":"From a material perspective","zh":""}],"ai":false,"summary":[{"g":"phrase","en":"when balanced with presence","zh":"与当下的陪伴相平衡时","src":"Ultimately, when balanced with presence, travel photography enriches our lives by allowing us to relive and celebrate our explorations.","label":"原文标注"},{"g":"phrase","en":"Experiential Validation Model","zh":"体验验证模型","src":"Tourists’ enthusiasm for photography while traveling is largely driven by the Experiential Validation Model,","label":"原文标注"},{"g":"phrase","en":"From a material perspective","zh":"从物质层面来看","src":"From a material perspective, capturing landmarks, local cuisines, or cultural performances provides a visual inventory of one’s adventures,","label":"原文标注"},{"g":"pattern","en":"… is (largely) determined by…","zh":"……（主要）由……决定","src":"Tourists’ enthusiasm for photography while traveling is largely driven by the Experiential Validation Model,","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"a photo of oneself at the Eiffel Tower is not just a picture but a declaration of having broadened one’s horizons.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Tourists’ enthusiasm for photography while traveling is largely driven by the Experiential Validation Model,","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance,","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, when balanced with presence, travel photography enriches our lives by allowing us to relive and celebrate our explorations.","label":"整理"}],"words":178,"recite":false},{"id":"bx-125iwqm","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"45: Why do some people don’t mind others walking into the…","question":"45: Why do some people don’t mind others walking into their shot when they’re taking photos?","sentences":["Some people remain unbothered when strangers wander into their camera frame because of the Authenticity Embrace Model,","which values genuine, unscripted moments over sterile perfection.","Aesthetic psychology suggests that this mindset appreciates the dynamic, unpredictable nature of real life,","viewing unexpected passersby as organic contributions to a scene’s atmosphere.","From a material perspective, such individuals often shoot in bustling environments like street markets or festivals,","where the energy of crowds is integral to the story.","Cognitively, they exhibit a flexible, inclusive approach to creativity,","understanding that a “flawed” image can evoke stronger emotions and memories than a technically flawless one.","For example,","a photo of a lively street with blurred figures in motion might convey the vibrancy of a city far better than an empty,","posed shot.","At a macro level, this attitude reflects broader cultural shifts toward authenticity in visual arts and social media,","challenging overly curated ideals.","It also fosters a more relaxed, tolerant public etiquette.","Ultimately, embracing these happy accidents allows photographers to capture the true spirit of a place,","turning potential frustrations into serendipitous artistic opportunities."],"expressions":[{"en":"Authenticity Embrace Model","zh":"真实接纳模型"},{"en":"over sterile perfection","zh":"刻板的完美"},{"en":"From a material perspective","zh":""}],"ai":false,"summary":[{"g":"phrase","en":"Authenticity Embrace Model","zh":"真实接纳模型","src":"Some people remain unbothered when strangers wander into their camera frame because of the Authenticity Embrace Model,","label":"原文标注"},{"g":"phrase","en":"over sterile perfection","zh":"刻板的完美","src":"which values genuine, unscripted moments over sterile perfection.","label":"原文标注"},{"g":"phrase","en":"From a material perspective","zh":"从物质层面来看","src":"From a material perspective, such individuals often shoot in bustling environments like street markets or festivals,","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, such individuals often shoot in bustling environments like street markets or festivals,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, this attitude reflects broader cultural shifts toward authenticity in visual arts and social media,","label":"整理"},{"g":"pattern","en":"A allows/enables sb. to do B","zh":"A使某人能够做B","src":"Ultimately, embracing these happy accidents allows photographers to capture the true spirit of a place,","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, embracing these happy accidents allows photographers to capture the true spirit of a place,","label":"整理"},{"g":"idiom","en":"individuals → people / folks","zh":"人们（口语替换）","src":"From a material perspective, such individuals often shoot in bustling environments like street markets or festivals,","label":"整理"}],"words":180,"recite":false},{"id":"bx-6qco2t","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"51: Is it important for everyone to have a specialized sk…","question":"51: Is it important for everyone to have a specialized skill?","sentences":["The importance of possessing a specialized skill can be understood through the T-shaped Competence Model,","which combines broad foundational knowledge with deep expertise in one area.","Human resource development research indicates that such a profile enhances both adaptability and marketability in a rapidly changing job landscape.","From a material perspective, specialized skills often require specific tools or certifications,","such as a programmer’s laptop or a surgeon’s medical license, which serve as tangible assets.","Cognitively,","deep expertise fosters not only tech

*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f5f1;color:#222}
.wrap{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0}.sub{color:#777;font-size:13px}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}

.s-txt{flex:1;min-width:0}

.s-act .sb{min-width:44px;min-height:36px;padding:8px 12px}
.s-score{font-size:12px;color:#2f6b45;margin-top:4px;width:100%}
.s-score.warn{color:#a04000}
.s-score.mute{color:#888}
.s audio{width:100%;height:32px;margin-top:4px}
#voiceSel{max-width:100%;flex:1;min-width:140px}
button{border:0;border-radius:10px;padding:9px 12px;font-size:14px;background:#2f6b45;color:#fff;cursor:pointer}
button.g{background:#eee;color:#333}button.r{background:#c0392b}button:disabled{opacity:.4}
.sb{flex:none;padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.kg{margin-top:10px}.kg h4{margin:0 0 4px;font-size:14px;color:#555;border-left:3px solid #2f6b45;padding-left:6px}
.ki{padding:6px 0;border-bottom:1px dashed #eee}.ki b{color:#2f6b45;cursor:pointer}.ki .zh{color:#444}
.ki .src{font-size:12px;color:#777;margin-top:2px;font-style:italic}.ki mark{background:#fff0b3;font-style:normal}
.lb{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}.lb.o{background:#e8f0ea;color:#2f6b45}.lb.z{background:#eef0fb;color:#4a55a2}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal div{padding:6px 0;border-radius:6px;background:#f1f1f1}.cal .d{background:#2f6b45;color:#fff}.cal .t{outline:2px solid #e0a800}.cal .h{background:none;color:#999}
.big{font-size:28px;font-weight:700;color:#2f6b45}
audio{width:100%;margin-top:6px}
select{padding:7px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:14px}
.aibox{display:none;background:#fff4e5;border-left:3px solid #e08a00;padding:6px 8px;margin-top:6px;font-size:12px;color:#8a5300;border-radius:6px}
.tag{white-space:normal}
.timing{font-size:12px;color:#2f6b45;background:#f0f6f1;border-radius:6px;padding:4px 8px;margin:6px 0;display:inline-block}.timing.warn{color:#a04000;background:#fff1e6}.timing.info{color:#666;background:#f3f3f3}
.ex{color:#c0392b;font-size:12px}

re when I was younger, especially going to karaoke bars with friends.","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"But nowadays,","label":"整理"},{"g":"idiom","en":"unwind","zh":"放松","src":"It was a great way to unwind and catch up with people close to me.","label":"整理"}],"words":55,"recite":false},{"id":"mi-1ts0lhb","src":"口语课笔记","srcDoc":"口语课笔记 · 0923 作业","part":"P1","topic":"0923作业","question":"Have you ever learnt how to sing?","sentences":["Not really.","I’ve never taken singing lessons because I’ve never wanted to become a professional singer.","For me, singing is just something I do for fun.","I’m happy to sing along to my favorite songs whenever I feel like it."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"sing along to","zh":"跟着唱","src":"I’m happy to sing along to my favorite songs whenever I feel like it.","label":"整理"},{"g":"phrase","en":"for fun","zh":"为了好玩","src":"For me, singing is just something I do for fun.","label":"整理"},{"g":"pattern","en":"For me, …","zh":"对我来说……","src":"For me, singing is just something I do for fun.","label":"整理"},{"g":"pattern","en":"Whenever I…, I…","zh":"每当我……，我就……","src":"I’m happy to sing along to my favorite songs whenever I feel like it.","label":"整理"},{"g":"pattern","en":"…, for example, …（举例）","zh":"比如……","src":"I’m happy to sing along to my favorite songs whenever I feel like it.","label":"整理"},{"g":"idiom","en":"Not really. …","zh":"其实不怎么……（口语否定开头）","src":"Not really.","label":"整理"}],"words":40,"recite":false},{"id":"fl-1quo9t2","src":"主题素材与提纲","srcDoc":"P2 提纲 · 逐字稿","part":"P2","topic":"想再去一次的城市","question":"Describe a city that you have been to and would like to visit again","sentences":["Well, the city I’d really love to visit again is Hangzhou, in eastern China.","I went there a while ago, and honestly,","what struck me most was that it felt like a glimpse into the future.","During my stay, I spent some time exploring the city,","looking around its business districts and taking in the urban landscape.","You know, what really caught my eye was the architecture, especially the Hangzhou Olympic Sports Centre Stadium.","Its exterior resembles a gigantic lotus flower, with sweeping white curves and an enormous steel structure.","The design almost looks as if it belongs in a science-fiction film, rather than in the real world.","Standing there, you can really appreciate how architecture can make a city feel as though it’s stepping into the future.","Another thing I noticed was how digital everyday life had become.","Like,","paying for a coffee or buying something in a shop was often just a matter of scanning a QR code.","Technology seemed to be woven into even the smallest parts of people’s routines.","And with Hangzhou’s strong tech and AI industries, you could also sense an entrepreneurial energy in the city.","Livestreaming,","online businesses and new ways of working seemed to be opening up opportunities for individuals to build something of their own.","What fascinates me, though, is the pace of change.","New ideas can take off incredibly quickly, and people seem to be constantly adapting to new opportunities.","It makes you wonder how much one individual can achieve with the right technology and a good idea.","So, I’d love to go back, not just to see more of the city, but to observe how it evolves.","Honestly, Hangzhou gave me the feeling that the future isn’t some distant concept; in some ways,","it’s already part of everyday life.","And I’d really like to see what the next chapter looks like."],"expressions":[{"en":"A glimpse into the future","zh":"让人窥见未来的景象"},{"en":"What struck me most was…","zh":"最让我印象深刻的是……"},{"en":"Take in the urban landscape","zh":"欣赏、观察城市景观"},{"en":"What really caught my eye was…","zh":"真正吸引我注意的是……"},{"en":"Sweeping white curves","zh":"舒展流畅的白色曲线"}],"ai":false,"summary":[{"g":"phrase","en":"A glimpse into the future","zh":"让人窥见未来的景象","src":"what struck me most was that it felt like a glimpse into the future.","label":"原文标注"},{"g":"phrase","en":"Sweeping white curves","zh":"舒展流畅的白色曲线","src":"Its exterior resembles a gigantic lotus flower, with sweeping white curves and an enormous steel structure.","label":"原文标注"},{"g":"phrase","en":"spend time (doing)","zh":"花时间（做）","src":"During my stay, I spent some time exploring the city,","label":"整理"},{"g":"pattern","en":"What struck me most was…","zh":"最让我印象深刻的是……","src":"what struck me most was that it felt like a glimpse into the future.","label":"原文标注"},{"g":"pattern","en":"What really caught my eye was…","zh":"真正吸引我注意的是……","src":"You know, what really caught my eye was the architecture, especially the Hangzhou Olympic Sports Centre Stadium.","label":"原文标注"},{"g":"pattern","en":"A makes B feel…","zh":"A让B感觉……","src":"Standing there, you can really appreciate how architecture can make a city feel as though it’s stepping into the future.","label":"整理"},{"g":"idiom","en":"you know,","zh":"你知道的（口语填充）","src":"You know, what really caught my eye was the architecture, especially the Hangzhou Olympic Sports Centre Stadium.","label":"整理"},{"g":"idiom","en":"Honestly, …","zh":"说实话","src":"I went there a while ago, and honestly,","label":"整理"}],"words":311,"recite":false},{"id":"fl-k89vmz","src":"主题素材与提纲","srcDoc":"P2 提纲 · 逐字稿","part":"P2","topic":"做困难事情并且成功的人","question":"Describe a person you know who did something difficult and was successful","sentences":["Well, one person I really admire is Cai Lei, a former senior executive at JD.com,","one of China’s major internet companies.","What makes his story particularly striking is that, in 2019, just as his career was progressing,","he was diagnosed with ALS, also known as motor neurone disease.","It’s a condition that gradually affects muscle control, so over time, even basic things like moving around,","speaking and swallowing can become extremely difficult.","For someone whose work had always involved communication, decision-making and managing people,","this must have meant a huge change to almost every aspect of his life.","But here’s what I find remarkable.","Rather than focusing solely on his own treatment,","he decided to use his business experience to help advance research into the disease.","Although he had no professional background in medicine, he began bringing together scientists, doctors, pharmaceutical companies and other resources.","He also supported patient data platforms, research collaborations, drug development and fundraising.","Of course, this wasn’t something he could achieve overnight.","Medical research is unpredictable, and many potential treatments never make it through the development process.","Yet he continued to coordinate different teams and explore new ways to use technology to speed things up.","According to reports in 2024,","he had helped advance more than a hundred drug development programmes and connected with over a thousand scientists.","Honestly,","what I admire most is the way he turned his personal struggle into a wider effort to help other patients.","To me, his success isn’t simply about how many projects he’s supported;","it’s about building connections and creating opportunities for progress in an area where answers are still limited.","I find that genuinely inspiring because it shows that even when we can’t control our circumstances,","we may still be able to influence what happens next."],"expressions":[{"en":"What makes his story particularly striking is","zh":"…他的故事尤其令人印象深刻的地方在于……"},{"en":"Rather than focusing solely on…","zh":"他没有只专注于……，而是……非常适合突出一个人的选择和行动。"},{"en":"Bring people and resources together","zh":"把人和资源整合起来"},{"en":"This wasn’t something he could achieve overnight.","zh":"这不是一朝一夕就能做到的事情。"},{"en":"Turn his personal struggle into a wider effort","zh":"把个人的困境转化为更广泛的行动"}],"ai":false,"summary":[{"g":"phrase","en":"be diagnosed with","zh":"被诊断出","src":"he was diagnosed with ALS, also known as motor neurone disease.","label":"整理"},{"g":"pattern","en":"What makes his story particularly striking is","zh":"…他的故事尤其令人印象深刻的地方在于……","src":"What makes his story particularly striking is that, in 2019, just as his career was progressing,","label":"原文标注"},{"g":"pattern","en":"Rather than focusing solely on…","zh":"他没有只专注于……，而是……非常适合突出一个人的选择和行动。","src":"Rather than focusing solely on his own treatment,","label":"原文标注"},{"g":"pattern","en":"This wasn’t something he could achieve overnight.","zh":"这不是一朝一夕就能做到的事情。","src":"Of course, this wasn’t something he could achieve overnight.","label":"原文标注"},{"g":"idiom","en":"Of course.","zh":"当然","src":"Of course, this wasn’t something he could achieve overnight.","label":"整理"},{"g":"idiom","en":"Honestly, …","zh":"说实话","src":"Honestly,","label":"整理"}],"words":298,"recite":false},{"id":"fl-pzru9z","src":"主题素材与提纲","srcDoc":"P2 提纲 · 逐字稿","part":"P2","topic":"对结果开心的重要决定","question":"Describe a time you made an important decision and were happy with the result","sentences":["My important decision was to do everything I could to save my sick cat rather than give up on him.","Well, I’d only adopted him a short time before he was diagnosed with FIP,","a serious and potentially life-threatening disease in cats.","Honestly, it came as a real shock because I’d only just started getting used to having him around,","and suddenly I was faced with the possibility of losing him.","What made it even harder was that the vet asked me whether I wanted to continue with treatment or give up.","At that point, I had to think carefully about what I should do.","Of course, I knew treatment could take months, and there was no guarantee that he would recover.","It also meant investing a lot of time, energy and money.","So, you know, it wasn’t a decision I could make without worrying about the outcome.","But deep down, I felt that since I’d chosen to bring him into my life,","I also had a responsibility to care for him when things got difficult.","To me, every life deserves a chance, even when the outcome is uncertain.","So, rather than giving up,","I started researching treatment options online and managed to find medication that I could use for his treatment.","The following few months were quite stressful,","because I had to keep an eye on his condition and hope that things were moving in the right direction.","Thankfully, after months of treatment, he finally recovered.","Well, I can’t really describe how relieved I felt when I saw him getting back to his normal self.","Looking back, I’m happy with my decision not simply because the treatment worked,","but because I didn’t let fear of a bad outcome make the decision for me.","It taught me that taking responsibility sometimes means staying committed when things are uncertain.","And honestly, seeing him healthy and full of life again made every bit of effort worthwhile."],"expressions":[{"en":"do everything I could to…","zh":"尽我所能去……"},{"en":"It came as a real shock.","zh":"这件事让我非常震惊"},{"en":"there was no guarantee that…","zh":"无法保证……"},{"en":"deep down, I felt that…","zh":"内心深处"},{"en":"bring him into my life","zh":"让他成为我生命中的一部分"}],"ai":false,"summary":[{"g":"phrase","en":"bring him into my life","zh":"让他成为我生命中的一部分","src":"But deep down, I felt that since I’d chosen to bring him into my life,","label":"原文标注"},{"g":"phrase","en":"be diagnosed with","zh":"被诊断出","src":"Well, I’d only adopted him a short time before he was diagnosed with FIP,","label":"整理"},{"g":"pattern","en":"do everything I could to…","zh":"尽我所能去……","src":"My important decision was to do everything I could to save my sick cat rather than give up on him.","label":"原文标注"},{"g":"pattern","en":"It came as a real shock.","zh":"这件事让我非常震惊","src":"Honestly, it came as a real shock because I’d only just started getting used to having him around,","label":"原文标注"},{"g":"pattern","en":"there was no guarantee that…","zh":"无法保证……","src":"Of course, I knew treatment could take months, and there was no guarantee that he would recover.","label":"原文标注"},{"g":"pattern","en":"deep down, I felt that…","zh":"内心深处","src":"But deep down, I felt that since I’d chosen to bring him into my life,","label":"原文标注"},{"g":"idiom","en":"Of course.","zh":"当然","src":"Of course, I knew treatment could take months, and there was no guarantee that he would recover.","label":"整理"},{"g":"idiom","en":"you know,","zh":"你知道的（口语填充）","src":"So, you know, it wasn’t a decision I could make without worrying about the outcome.","label":"整理"}],"words":324,"recite":false},{"id":"mi-p2-childhood-friend","src":"口语课笔记","srcDoc":"口语课笔记 · 1021 背诵","part":"P2","topic":"儿时好朋友","question":"Describe a childhood friend.","sentences":["I’d love to talk about my closest childhood friend, Leo.","He was born in SZ,which is a one-hour drive from where I grew up.","Appearance-wise, he was a little on the chubby side, looking incredibly warm and approachable.","I first got to know him in primary school when I was about ten years old.","He had just transferred to my school from another city, and as luck would have it,","he was assigned to sit right next to me.","If my memory serves me right,","I struck up a conversation with him on the very first day I saw him,","and it turned out that we shared loads of interests, from English movies and singing to football,","so we really hit it off, and naturally we soon became inseparable,","and we would spend most of our leisure time together.","I remember, on weekdays, after school, we would play football, or just watch TV shows.","On weekends, we invariably went cycling together after finishing our homework.","We even celebrated each other’s birthdays, exchanging small but meaningful gifts every year.","You know, we were just as thick as thieves back then Looking back, I would say,","there are several reasons why I enjoyed spending time with him He was super humorous, I mean,","He would crack a dad joke when you least expect it,","which never failed to crack me up/ amuse me.","I have to say, hanging out with him was always fun and relaxing.","He was super helpful and academically gifted, especially when it came to maths, which happened to be my weakest subject.","He was always more than willing to help me out.","In fact, had it not been for his tutoring before our graduation exam,","I would never have made so much progress in my studies.","Even though we live in different cities now, our friendship has stood the test of time.","We still keep in regular touch on WeChat and catch up in person during the Spring Festival.","We never miss sending each other birthday gifts, and he remains one of the most reliable people in my life."],"expressions":[{"en":"appearance-wise","zh":"从外貌上来说"},{"en":"a little on the chubby side","zh":"微微胖"},{"en":"as luck would have it","zh":"巧的是，碰巧"},{"en":"as thick as thieves","zh":"亲密无间"},{"en":"crack sb. up","zh":"把某人逗笑"}],"ai":false,"summary":[{"g":"phrase","en":"catch up","zh":"叙旧，赶上","src":"We still keep in regular touch on WeChat and catch up in person during the Spring Festival.","label":"整理"},{"g":"phrase","en":"turn out (that)","zh":"结果是","src":"and it turned out that we shared loads of interests, from English movies and singing to football,","label":"整理"},{"g":"pattern","en":"a little on the chubby side","zh":"微微胖","src":"Appearance-wise, he was a little on the chubby side, looking incredibly warm and approachable.","label":"原文标注"},{"g":"pattern","en":"…, especially when…","zh":"尤其是当……","src":"He was super helpful and academically gifted, especially when it came to maths, which happened to be my weakest subject.","label":"整理"},{"g":"pattern","en":"one of the most…","zh":"最……之一","src":"We never miss sending each other birthday gifts, and he remains one of the most reliable people in my life.","label":"整理"},{"g":"idiom","en":"appearance-wise","zh":"从外貌上来说","src":"Appearance-wise, he was a little on the chubby side, looking incredibly warm and approachable.","label":"原文标注"},{"g":"idiom","en":"as luck would have it","zh":"巧的是，碰巧","src":"He had just transferred to my school from another city, and as luck would have it,","label":"原文标注"},{"g":"idiom","en":"as thick as thieves","zh":"亲密无间","src":"You know, we were just as thick as thieves back then Looking back, I would say,","label":"原文标注"}],"words":351,"recite":true},{"id":"bx-m8kosx","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What is the difference between the city and the countryside?","question":"What is the difference between the city and the countryside?","sentences":["The differences between urban and rural areas primarily stem from resource distribution patterns.","Urban geography indicates that cities function as hubs of economic agglomeration, featuring advanced infrastructure and concentrated populations.","This leads to faster-paced lifestyles and greater career opportunities.","Conversely, rural areas offer expansive natural landscapes and closer-knit communities.","From a material perspective, cities provide convenient public transport and modern amenities,","while the countryside ensures access to green spaces and ecological resources.","Cognitively, urban living fosters adaptability and openness to diversity,","whereas rural environments cultivate a sense of peace and connection to nature.","At a macro level, the urban-rural divide influences national strategies for balanced development.","Governments implement policies to bridge infrastructure gaps and promote rural revitalisation.","However, excessive urbanisation can cause congestion and environmental strain.","Ultimately, both settings possess unique values.","A harmonious society requires coordinated urban-rural integration.","Therefore, understanding these differences helps individuals make informed lifestyle choices.","Modern remote work technologies are gradually blurring these traditional boundaries.","Societies benefit when both urban and rural areas thrive."],"expressions":[{"en":"stem from","zh":""},{"en":"ensures access to","zh":""},{"en":"concentrated populations","zh":"人口集中"},{"en":"closer-knit communities","zh":"关系紧密的社区"},{"en":"openness to diversity","zh":"促进适应性&多样性的包容"}],"ai":false,"summary":[{"g":"phrase","en":"stem from","zh":"源于","src":"The differences between urban and rural areas primarily stem from resource distribution patterns.","label":"原文标注"},{"g":"phrase","en":"ensures access to","zh":"确保能获得","src":"while the countryside ensures access to green spaces and ecological resources.","label":"原文标注"},{"g":"phrase","en":"concentrated populations","zh":"人口集中","src":"Urban geography indicates that cities function as hubs of economic agglomeration, featuring advanced infrastructure and concentrated populations.","label":"原文标注"},{"g":"phrase","en":"closer-knit communities","zh":"关系紧密的社区","src":"Conversely, rural areas offer expansive natural landscapes and closer-knit communities.","label":"原文标注"},{"g":"phrase","en":"openness to diversity","zh":"促进适应性&多样性的包容","src":"Cognitively, urban living fosters adaptability and openness to diversity,","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, cities provide convenient public transport and modern amenities,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, the urban-rural divide influences national strategies for balanced development.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, both settings possess unique values.","label":"整理"}],"words":168,"recite":false},{"id":"bx-182uanf","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Some people say large cities are suitable for old people,…","question":"Some people say large cities are suitable for old people, is that true?","sentences":["The suitability of large cities for elderly individuals largely depends on the accessibility of public services.","Gerontological sociology highlights that metropolises concentrate high-quality medical facilities, ensuring prompt healthcare for age-related conditions.","Materially, comprehensive public transport and barrier-free infrastructure facilitate mobility.","Cognitively, cities offer diverse cultural venues, parks and social groups that combat loneliness and stimulate mental engagement.","From a macro perspective, urban areas are better equipped with institutional elderly care support,","aligning with the national strategy of healthy ageing.","However, challenges such as traffic congestion, air pollution and high living costs may negatively impact seniors’ wellbeing.","Some elderly individuals prefer quieter, nature-rich environments for retirement.","Ultimately, the decision should consider personal health and social connections.","Policymakers are working to improve age-friendly urban planning.","Therefore, while large cities provide unparalleled medical and social resources, the ideal living environment varies for each older adult.","A balanced approach involves optimising both urban and rural elderly care systems."],"expressions":[{"en":"are better equipped with","zh":""},{"en":"aligning with","zh":""},{"en":"public services","zh":"公共服务的可及性"},{"en":"comprehensive public transport","zh":"完善的公共交通体系"},{"en":"barrier-free infrastructure","zh":"无障碍基础设施"}],"ai":false,"summary":[{"g":"phrase","en":"are better equipped with","zh":"配备更完善","src":"From a macro perspective, urban areas are better equipped with institutional elderly care support,","label":"原文标注"},{"g":"phrase","en":"aligning with","zh":"与……一致","src":"aligning with the national strategy of healthy ageing.","label":"原文标注"},{"g":"phrase","en":"public services","zh":"公共服务的可及性","src":"The suitability of large cities for elderly individuals largely depends on the accessibility of public services.","label":"原文标注"},{"g":"phrase","en":"comprehensive public transport","zh":"完善的公共交通体系","src":"Materially, comprehensive public transport and barrier-free infrastructure facilitate mobility.","label":"原文标注"},{"g":"phrase","en":"barrier-free infrastructure","zh":"无障碍基础设施","src":"Materially, comprehensive public transport and barrier-free infrastructure facilitate mobility.","label":"原文标注"},{"g":"pattern","en":"… largely depends on…","zh":"……在很大程度上取决于……","src":"The suitability of large cities for elderly individuals largely depends on the accessibility of public services.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Therefore, while large cities provide unparalleled medical and social resources, the ideal living environment varies for each older adult.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, comprehensive public transport and barrier-free infrastructure facilitate mobility.","label":"整理"}],"words":154,"recite":false},{"id":"bx-1olqvvc","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it possible that all of the population move to cities?","question":"Is it possible that all of the population move to cities?","sentences":["It is fundamentally impossible for the entire global population to relocate to cities due to environmental carrying capacity constraints.","Urban ecology research demonstrates that every city has a finite threshold for resources such as water, energy and land.","Materially, unlimited urban concentration would exhaust housing supplies, overwhelm waste management systems and deplete essential utilities.","Cognitively, extreme overcrowding elevates stress levels and reduces overall life satisfaction.","From a macro perspective, such a shift would dismantle global food production systems,","as rural areas would lack the workforce to sustain agriculture.","Economically, the service sector alone cannot absorb the entire labour force.","While urban areas offer economic opportunities, balanced national development requires rural vitality.","Governments worldwide promote rural infrastructure to prevent excessive urbanisation.","Ultimately, sustainable development relies on harmonious urban-rural integration.","Therefore, rather than universal urban migration, societies should aim for equitable distribution of resources.","Technological innovations in smart cities can optimise existing capacities.","The future lies in developing interconnected networks of cities and towns."],"expressions":[{"en":"carrying capacity constraints","zh":"环境承载力约束"},{"en":"Urban ecology research","zh":"城市生态学研究"},{"en":"finite threshold","zh":"有限阈值"},{"en":"deplete essential utilities","zh":"基本公共服务设施"},{"en":"harmonious urban-rural integration","zh":"城乡融合发展"}],"ai":false,"summary":[{"g":"phrase","en":"carrying capacity constraints","zh":"环境承载力约束","src":"It is fundamentally impossible for the entire global population to relocate to cities due to environmental carrying capacity constraints.","label":"原文标注"},{"g":"phrase","en":"Urban ecology research","zh":"城市生态学研究","src":"Urban ecology research demonstrates that every city has a finite threshold for resources such as water, energy and land.","label":"原文标注"},{"g":"phrase","en":"finite threshold","zh":"有限阈值","src":"Urban ecology research demonstrates that every city has a finite threshold for resources such as water, energy and land.","label":"原文标注"},{"g":"phrase","en":"deplete essential utilities","zh":"基本公共服务设施","src":"Materially, unlimited urban concentration would exhaust housing supplies, overwhelm waste management systems and deplete essential utilities.","label":"原文标注"},{"g":"phrase","en":"harmonious urban-rural integration","zh":"城乡融合发展","src":"Ultimately, sustainable development relies on harmonious urban-rural integration.","label":"原文标注"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"Therefore, rather than universal urban migration, societies should aim for equitable distribution of resources.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While urban areas offer economic opportunities, balanced national development requires rural vitality.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, unlimited urban concentration would exhaust housing supplies, overwhelm waste management systems and deplete essential utilities.","label":"整理"}],"words":162,"recite":false},{"id":"bx-10j22kr","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Are people in the countryside friendlier than people in t…","question":"Are people in the countryside friendlier than people in the city?","sentences":["The perception that rural residents are friendlier is rooted in the social trust radius model.","Rural sociology explains that villages operate as acquaintance societies characterised by low population mobility and repeated face-to-face interactions.","Materially, this stability fosters tightly-knit communities where neighbours readily offer practical help.","Cognitively, frequent informal encounters cultivate empathy and a stronger sense of mutual responsibility.","At a macro level, rural areas often exhibit higher levels of community cohesion and informal social support networks.","However, urban environments are not devoid of warmth.","City dwellers interact within larger, more diverse circles, relying on institutional trust and civic norms.","Fast-paced lifestyles may limit spontaneous greetings, but urban residents demonstrate friendliness through volunteerism and professional courtesy.","Ultimately, friendliness manifests differently across contexts.","Generalisations risk oversimplifying complex social dynamics.","Therefore, both rural and urban societies possess unique strengths in fostering human connection.","Promoting community-building initiatives in cities can bridge these perceived gaps.","Respect and kindness remain universal values regardless of geography."],"expressions":[{"en":"is rooted in","zh":""},{"en":"characterised by","zh":""},{"en":"devoid of","zh":""},{"en":"regardless of","zh":""},{"en":"trust radius model","zh":"社会信任半径模型"}],"ai":false,"summary":[{"g":"phrase","en":"is rooted in","zh":"根植于","src":"The perception that rural residents are friendlier is rooted in the social trust radius model.","label":"原文标注"},{"g":"phrase","en":"characterised by","zh":"以……为特征","src":"Rural sociology explains that villages operate as acquaintance societies characterised by low population mobility and repeated face-to-face interactions.","label":"原文标注"},{"g":"phrase","en":"devoid of","zh":"缺乏，没有","src":"However, urban environments are not devoid of warmth.","label":"原文标注"},{"g":"phrase","en":"regardless of","zh":"不管，无论","src":"Respect and kindness remain universal values regardless of geography.","label":"原文标注"},{"g":"phrase","en":"trust radius model","zh":"社会信任半径模型","src":"The perception that rural residents are friendlier is rooted in the social trust radius model.","label":"原文标注"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, rural areas often exhibit higher levels of community cohesion and informal social support networks.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, friendliness manifests differently across contexts.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, this stability fosters tightly-knit communities where neighbours readily offer practical help.","label":"整理"}],"words":159,"recite":false},{"id":"bx-1753c7k","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Are there any changes in your city?","question":"Are there any changes in your city?","sentences":["Cities undergo continuous transformation through the process of urban metabolism.","Urban geography research describes this as the constant renewal of physical infrastructure and functional adaptation.","Materially, my city has witnessed extensive subway expansions, green building constructions and the renovation of older districts.","These tangible changes improve living standards and reduce environmental footprints.","Cognitively, public awareness of sustainability has risen markedly.","More residents embrace cycling and public transport over private cars.","From a macro perspective, the city is evolving into a smarter and more liveable space,","integrating digital technologies for efficient public services.","However, rapid development also brings challenges like the displacement of long-term communities.","Urban planners must balance modernisation with social equity.","Ultimately, these changes reflect broader national urbanisation strategies.","Therefore, observing city transformations offers insights into societal progress.","The transition towards eco-friendly urbanism benefits future generations.","Continuous adaptation ensures the city remains resilient and vibrant."],"expressions":[{"en":"offers insights into","zh":""},{"en":"urban metabolism","zh":"城市代谢"},{"en":"long-term communities","zh":"长期社区的流离失所"},{"en":"national urbanisation strategies","zh":"更广泛的国家城镇化战略"}],"ai":false,"summary":[{"g":"phrase","en":"offers insights into","zh":"提供对……的洞见","src":"Therefore, observing city transformations offers insights into societal progress.","label":"原文标注"},{"g":"phrase","en":"urban metabolism","zh":"城市代谢","src":"Cities undergo continuous transformation through the process of urban metabolism.","label":"原文标注"},{"g":"phrase","en":"long-term communities","zh":"长期社区的流离失所","src":"However, rapid development also brings challenges like the displacement of long-term communities.","label":"原文标注"},{"g":"phrase","en":"national urbanisation strategies","zh":"更广泛的国家城镇化战略","src":"Ultimately, these changes reflect broader national urbanisation strategies.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, the city is evolving into a smarter and more liveable space,","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, these changes reflect broader national urbanisation strategies.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, my city has witnessed extensive subway expansions, green building constructions and the renovation of older districts.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, these changes reflect broader national urbanisation strategies.","label":"整理"}],"words":146,"recite":false},{"id":"bx-l4k23z","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What should the government do to improve citizen’s safety?","question":"What should the government do to improve citizen’s safety?","sentences":["Enhancing public safety requires a comprehensive prevention-oriented approach from the government.","Public safety studies advocate for systematic risk reduction through infrastructure, legislation and education.","Materially, authorities should upgrade road lighting, install surveillance systems and eliminate traffic hazards to prevent accidents.","Cognitively, launching community safety education campaigns raises citizens’ awareness of potential risks such as cyber fraud and fire hazards.","From a macro perspective, improving safety involves enacting and enforcing robust laws while fostering police-community collaboration.","A secure society relies on both institutional protection and individual vigilance.","However, excessive surveillance may raise privacy concerns.","Therefore, measures must strike a balance between security and civil liberties.","Investment in emergency response systems further strengthens resilience.","Ultimately, a safe environment promotes social stability and economic prosperity.","Therefore, governments should adopt multi-faceted strategies tailored to local needs.","International cooperation on safety standards also contributes to national security.","Public trust in safety institutions is equally vital."],"expressions":[{"en":"advocate for","zh":""},{"en":"enacting and enforcing","zh":""},{"en":"strike a balance between","zh":""},{"en":"tailored to","zh":""},{"en":"install surveillance systems","zh":"监控系统 "}],"ai":false,"summary":[{"g":"phrase","en":"advocate for","zh":"倡导，支持","src":"Public safety studies advocate for systematic risk reduction through infrastructure, legislation and education.","label":"原文标注"},{"g":"phrase","en":"enacting and enforcing","zh":"制定并执行","src":"From a macro perspective, improving safety involves enacting and enforcing robust laws while fostering police-community collaboration.","label":"原文标注"},{"g":"phrase","en":"strike a balance between","zh":"在……之间取得平衡","src":"Therefore, measures must strike a balance between security and civil liberties.","label":"原文标注"},{"g":"phrase","en":"tailored to","zh":"为……量身定制","src":"Therefore, governments should adopt multi-faceted strategies tailored to local needs.","label":"原文标注"},{"g":"phrase","en":"install surveillance systems","zh":"监控系统","src":"Materially, authorities should upgrade road lighting, install surveillance systems and eliminate traffic hazards to prevent accidents.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, improving safety involves enacting and enforcing robust laws while fostering police-community collaboration.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Therefore, measures must strike a balance between security and civil liberties.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, authorities should upgrade road lighting, install surveillance systems and eliminate traffic hazards to prevent accidents.","label":"整理"}],"words":150,"recite":false},{"id":"bx-1qz21ih","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it difficult to do business in today’s world?","question":"Is it difficult to do business in today’s world?","sentences":["Conducting business in the contemporary world presents significant challenges due to increasing market entropy.","Business economics describes this as a state of heightened uncertainty characterised by intense competition and complex regulations.","Materially, entrepreneurs face fluctuating raw material costs and unstable supply chains, which elevate operational risks.","Cognitively, rapidly shifting consumer preferences demand constant innovation and adaptability.","From a macro perspective, global economic volatility and evolving trade policies add layers of unpredictability.","However, technological advancements simultaneously lower barriers to entry.","Digital platforms enable small businesses to reach global markets with minimal capital.","Supportive government policies, such as tax incentives for startups, also alleviate difficulties.","Ultimately, success depends on resilience and strategic agility.","While the business environment is undeniably demanding, it also offers unprecedented opportunities.","Therefore, aspiring entrepreneurs must cultivate both risk management skills and creative problem-solving abilities.","A positive mindset transforms challenges into competitive advantages.","Societies that encourage innovation tend to foster more dynamic business ecosystems."],"expressions":[{"en":"increasing market entropy","zh":"熵增"},{"en":"tax incentives","zh":"税收优惠 "},{"en":"strategic agility","zh":"战略敏捷性"},{"en":"undeniably demanding","zh":"不可否认的要求高"},{"en":"offers unprecedented opportunities","zh":"前所未有的机会"}],"ai":false,"summary":[{"g":"phrase","en":"increasing market entropy","zh":"熵增","src":"Conducting business in the contemporary world presents significant challenges due to increasing market entropy.","label":"原文标注"},{"g":"phrase","en":"tax incentives","zh":"税收优惠","src":"Supportive government policies, such as tax incentives for startups, also alleviate difficulties.","label":"原文标注"},{"g":"phrase","en":"strategic agility","zh":"战略敏捷性","src":"Ultimately, success depends on resilience and strategic agility.","label":"原文标注"},{"g":"phrase","en":"undeniably demanding","zh":"不可否认的要求高","src":"While the business environment is undeniably demanding, it also offers unprecedented opportunities.","label":"原文标注"},{"g":"phrase","en":"offers unprecedented opportunities","zh":"前所未有的机会","src":"While the business environment is undeniably demanding, it also offers unprecedented opportunities.","label":"原文标注"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While the business environment is undeniably demanding, it also offers unprecedented opportunities.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, global economic volatility and evolving trade policies add layers of unpredictability.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, entrepreneurs face fluctuating raw material costs and unstable supply chains, which elevate operational risks.","label":"整理"}],"words":155,"recite":false},{"id":"bx-u7h31t","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"How can companies help protect the environment?","question":"How can companies help protect the environment?","sentences":["Companies play a pivotal role in environmental protection through the adoption of corporate environmental responsibility.","Environmental management research emphasises that integrating ecological considerations into business operations yields long-term benefits.","Materially, firms can transition to renewable energy, minimise waste and implement circular economy practices.","These actions directly reduce carbon footprints.","Cognitively, organisations should cultivate eco-conscious cultures by educating employees on sustainable practices and encouraging green commuting.","From a macro perspective, corporations influence entire industries by setting environmental benchmarks and promoting responsible consumption.","Consumers increasingly favour environmentally responsible brands, creating market incentives for sustainability.","However, genuine commitment must avoid greenwashing.","Transparent reporting and third-party certifications build public trust.","Ultimately, businesses that prioritise planetary health contribute to global sustainable development goals.","Therefore, environmental stewardship should be viewed as an investment rather than a cost.","Collaborative efforts between governments, companies and civil society accelerate the transition to a greener economy.","Future prosperity depends on such collective responsibility."],"expressions":[{"en":"transition to","zh":""},{"en":"circular economy practices","zh":"践行循环经济举措"},{"en":"setting environmental benchmarks","zh":"设定环境基准 "},{"en":"such collective responsibility","zh":"集体责任"}],"ai":false,"summary":[{"g":"phrase","en":"transition to","zh":"过渡到","src":"Materially, firms can transition to renewable energy, minimise waste and implement circular economy practices.","label":"原文标注"},{"g":"phrase","en":"circular economy practices","zh":"践行循环经济举措","src":"Materially, firms can transition to renewable energy, minimise waste and implement circular economy practices.","label":"原文标注"},{"g":"phrase","en":"setting environmental benchmarks","zh":"设定环境基准","src":"From a macro perspective, corporations influence entire industries by setting environmental benchmarks and promoting responsible consumption.","label":"原文标注"},{"g":"phrase","en":"such collective responsibility","zh":"集体责任","src":"Future prosperity depends on such collective responsibility.","label":"原文标注"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"Therefore, environmental stewardship should be viewed as an investment rather than a cost.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, corporations influence entire industries by setting environmental benchmarks and promoting responsible consumption.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, firms can transition to renewable energy, minimise waste and implement circular economy practices.","label":"整理"},{"g":"idiom","en":"emphasise → stress","zh":"强调（口语替换）","src":"Environmental management research emphasises that integrating ecological considerations into business operations yields long-term benefits.","label":"整理"}],"words":153,"recite":false},{"id":"bx-fdyg3c","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Does money equal success?","question":"Does money equal success?","sentences":["Equating money with success oversimplifies the multidimensional nature of human achievement.","Positive psychology posits that success encompasses various dimensions, including self-actualisation, social contribution and interpersonal fulfilment.","Materially, financial resources provide essential security and access to comfortable living standards.","However, cognitive and spiritual fulfilment derive from pursuing meaningful goals and helping others.","From a macro perspective, modern societies increasingly recognise diverse forms of success, celebrating achievements in arts, sciences,","community service and environmental conservation.","Many highly successful individuals prioritise purpose over profit.","While wealth can facilitate opportunities, it does not guarantee happiness or social respect.","Unhealthy obsession with money may lead to stress and damaged relationships.","Ultimately, a balanced view defines success as holistic well-being and positive societal impact.","Therefore, individuals should strive to align their careers with personal values.","Education systems play a role in broadening definitions of achievement.","A society that values multiple pathways to success fosters greater overall happiness."],"expressions":[{"en":"derive from","zh":""},{"en":"human achievement","zh":"人类成就的多维性"},{"en":"including self-actualisation","zh":"自我实现"},{"en":"purpose over profit","zh":"将目标置于利润之上"},{"en":"holistic well-being","zh":"整体福祉 "}],"ai":false,"summary":[{"g":"phrase","en":"derive from","zh":"源自","src":"However, cognitive and spiritual fulfilment derive from pursuing meaningful goals and helping others.","label":"原文标注"},{"g":"phrase","en":"human achievement","zh":"人类成就的多维性","src":"Equating money with success oversimplifies the multidimensional nature of human achievement.","label":"原文标注"},{"g":"phrase","en":"including self-actualisation","zh":"自我实现","src":"Positive psychology posits that success encompasses various dimensions, including self-actualisation, social contribution and interpersonal fulfilment.","label":"原文标注"},{"g":"phrase","en":"purpose over profit","zh":"将目标置于利润之上","src":"Many highly successful individuals prioritise purpose over profit.","label":"原文标注"},{"g":"phrase","en":"holistic well-being","zh":"整体福祉","src":"Ultimately, a balanced view defines success as holistic well-being and positive societal impact.","label":"原文标注"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While wealth can facilitate opportunities, it does not guarantee happiness or social respect.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, modern societies increasingly recognise diverse forms of success, celebrating achievements in arts, sciences,","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, financial resources provide essential security and access to comfortable living standards.","label":"整理"}],"words":151,"recite":false},{"id":"bx-1fnsur6","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"How can we tell the difference between an important and a…","question":"How can we tell the difference between an important and an easy decision?","sentences":["Distinguishing between important and easy decisions can be effectively achieved through the decision impact radius model.","Cognitive psychology explains that the significance of a choice correlates with its potential consequences and scope of influence.","Materially, important decisions typically involve substantial resource allocation, such as financial investments or career changes,","whereas easy decisions consume minimal physical or mental energy.","Cognitively, major choices require deep analytical thinking, risk assessment and future projection, while trivial ones rely on routine or intuition.","From a macro perspective, important decisions alter long-term trajectories and affect multiple stakeholders,","whereas minor decisions have limited and often reversible impacts.","However, consistently neglecting small decisions can accumulate into significant outcomes.","Therefore, individuals should develop the habit of evaluating the potential ripple effects of their choices.","Mindfulness practices enhance this discernment ability.","Ultimately, understanding this distinction promotes wiser time and energy management.","Therefore, prioritising important decisions ensures that critical life aspects receive due attention.","Societies benefit when citizens make informed, responsible choices."],"expressions":[{"en":"correlates with","zh":""},{"en":"impact radius model","zh":"决定影响半径模型"},{"en":"alter long-term trajectories","zh":"改变长期轨迹 "},{"en":"affect multiple stakeholders","zh":"影响多个利益相关方"},{"en":"potential ripple effects","zh":"潜在的连锁反应 "}],"ai":false,"summary":[{"g":"phrase","en":"correlates with","zh":"与……相关","src":"Cognitive psychology explains that the significance of a choice correlates with its potential consequences and scope of influence.","label":"原文标注"},{"g":"phrase","en":"impact radius model","zh":"决定影响半径模型","src":"Distinguishing between important and easy decisions can be effectively achieved through the decision impact radius model.","label":"原文标注"},{"g":"phrase","en":"alter long-term trajectories","zh":"改变长期轨迹","src":"From a macro perspective, important decisions alter long-term trajectories and affect multiple stakeholders,","label":"原文标注"},{"g":"phrase","en":"affect multiple stakeholders","zh":"影响多个利益相关方","src":"From a macro perspective, important decisions alter long-term trajectories and affect multiple stakeholders,","label":"原文标注"},{"g":"phrase","en":"potential ripple effects","zh":"潜在的连锁反应","src":"Therefore, individuals should develop the habit of evaluating the potential ripple effects of their choices.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, important decisions alter long-term trajectories and affect multiple stakeholders,","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Therefore, individuals should develop the habit of evaluating the potential ripple effects of their choices.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, important decisions typically involve substantial resource allocation, such as financial investments or career changes,","label":"整理"}],"words":161,"recite":false},{"id":"bx-3e5oyo","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it a good idea to make a small decision every day?","question":"Is it a good idea to make a small decision every day?","sentences":["Making a small decision every day is beneficial as it strengthens cognitive decision-making muscles.","Behavioural psychology supports the micro-habit accumulation model, where regular low-stakes choices build confidence and mental agility.","Materially, distributing decisions throughout the day prevents the exhaustion associated with confronting major dilemmas all at once.","Cognitively, each small choice serves as practice for evaluating options and accepting consequences.","This daily exercise enhances overall judgement and reduces procrastination tendencies.","From a macro perspective, individuals who consistently make small decisions develop more organised and proactive lifestyles.","However, excessive trivial choices can sometimes lead to decision fatigue.","The key lies in selecting meaningful minor decisions, such as choosing a healthy meal or planning a short walk.","Ultimately, the cumulative effect of positive small decisions contributes to long-term personal growth.","Therefore, embracing daily decision-making opportunities fosters greater self-efficacy.","Educational programmes can encourage this habit from a young age.","A society of decisive individuals tends to be more dynamic and innovative."],"expressions":[{"en":"micro-habit accumulation model","zh":"微习惯累积模型"},{"en":"where regular low-stakes","zh":"低风险的"},{"en":"reduces procrastination tendencies","zh":"拖延倾向"},{"en":"decision fatigue","zh":"决策疲劳"},{"en":"fosters greater self-efficacy","zh":"自我效能"}],"ai":false,"summary":[{"g":"phrase","en":"micro-habit accumulation model","zh":"微习惯累积模型","src":"Behavioural psychology supports the micro-habit accumulation model, where regular low-stakes choices build confidence and mental agility.","label":"原文标注"},{"g":"phrase","en":"where regular low-stakes","zh":"低风险的","src":"Behavioural psychology supports the micro-habit accumulation model, where regular low-stakes choices build confidence and mental agility.","label":"原文标注"},{"g":"phrase","en":"reduces procrastination tendencies","zh":"拖延倾向","src":"This daily exercise enhances overall judgement and reduces procrastination tendencies.","label":"原文标注"},{"g":"phrase","en":"decision fatigue","zh":"决策疲劳","src":"However, excessive trivial choices can sometimes lead to decision fatigue.","label":"原文标注"},{"g":"phrase","en":"fosters greater self-efficacy","zh":"自我效能","src":"Therefore, embracing daily decision-making opportunities fosters greater self-efficacy.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, individuals who consistently make small decisions develop more organised and proactive lifestyles.","label":"整理"},{"g":"pattern","en":"A leads to B","zh":"A导致B","src":"However, excessive trivial choices can sometimes lead to decision fatigue.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, distributing decisions throughout the day prevents the exhaustion associated with confronting major dilemmas all at once.","label":"整理"}],"words":158,"recite":false},{"id":"bx-1i9ynkk","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What little decisions do people make everyday?","question":"What little decisions do people make everyday?","sentences":["People make numerous little decisions daily, most of which are processed through automated cognitive routines.","Cognitive neuroscience explains that the brain conserves energy by converting frequent choices into habits.","Materially, these include selecting meals, choosing outfits and determining commuting routes.","Such decisions directly affect physical comfort and daily schedules.","Cognitively, relying on established preferences for trivial matters frees up mental resources for more significant problems.","This automatic processing enhances overall cognitive efficiency.","From a macro perspective, the smooth handling of minor daily choices contributes to societal productivity.","When individuals spend less time deliberating over small issues, they can focus on professional and creative tasks.","However, occasionally introducing mindful variations, like trying a new healthy recipe, can prevent rigid thinking.","Ultimately, the balance between automated and conscious choices supports well-being.","Therefore, understanding the role of little decisions helps people optimise their cognitive energy.","Public health campaigns sometimes leverage these small choices to promote healthier lifestyles.","Societies thrive when citizens manage their daily routines effectively."],"expressions":[{"en":"deliberating over","zh":""},{"en":"automated cognitive routines","zh":"自动化认知惯例"},{"en":"Public health campaigns","zh":"公共卫生运动 "}],"ai":false,"summary":[{"g":"phrase","en":"deliberating over","zh":"反复斟酌","src":"When individuals spend less time deliberating over small issues, they can focus on professional and creative tasks.","label":"原文标注"},{"g":"phrase","en":"automated cognitive routines","zh":"自动化认知惯例","src":"People make numerous little decisions daily, most of which are processed through automated cognitive routines.","label":"原文标注"},{"g":"phrase","en":"Public health campaigns","zh":"公共卫生运动","src":"Public health campaigns sometimes leverage these small choices to promote healthier lifestyles.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, the smooth handling of minor daily choices contributes to societal productivity.","label":"整理"},{"g":"pattern","en":"A helps (sb.) do B","zh":"A帮助（某人）做B","src":"Therefore, understanding the role of little decisions helps people optimise their cognitive energy.","label":"整理"},{"g":"pattern","en":"By doing…, …","zh":"通过做……","src":"Cognitive neuroscience explains that the brain conserves energy by converting frequent choices into habits.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, these include selecting meals, choosing outfits and determining commuting routes.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the balance between automated and conscious choices supports well-being.","label":"整理"}],"words":163,"recite":false},{"id":"bx-1gt2bk9","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What if people in a group have different opinions on a de…","question":"What if people in a group have different opinions on a decision?","sentences":["When group members hold differing opinions, the collective intelligence integration model offers a constructive pathway.","Social psychology research confirms that diverse perspectives, when managed respectfully, lead to more robust decisions.","Materially, conflicting views can reveal potential flaws and overlooked risks in proposed plans.","Cognitively, engaging with dissenting opinions encourages individuals to practise empathy and expand their thinking.","From a macro perspective, democratic deliberation mechanisms strengthen social cohesion and institutional legitimacy.","However, unmanaged conflicts may escalate into hostility.","Therefore, establishing norms of active listening and mutual respect is crucial.","Techniques such as brainstorming and voting help synthesise varied inputs.","Ultimately, the goal is not to eliminate differences but to integrate them productively.","Groups that embrace constructive debate often achieve higher-quality outcomes.","Therefore, organisations should cultivate inclusive communication cultures.","Educational settings play a vital role in teaching conflict resolution skills.","A society that values diverse opinions tends to be more innovative and resilient."],"expressions":[{"en":"engaging with","zh":""},{"en":"intelligence integration model","zh":"群体智慧整合模型 "},{"en":"democratic deliberation mechanisms","zh":"民主协商机制 "},{"en":"strengthen social cohesion","zh":"社会凝聚力 "},{"en":"institutional legitimacy","zh":"制度合法性"}],"ai":false,"summary":[{"g":"phrase","en":"engaging with","zh":"参与，接触","src":"Cognitively, engaging with dissenting opinions encourages individuals to practise empathy and expand their thinking.","label":"原文标注"},{"g":"phrase","en":"intelligence integration model","zh":"群体智慧整合模型","src":"When group members hold differing opinions, the collective intelligence integration model offers a constructive pathway.","label":"原文标注"},{"g":"phrase","en":"democratic deliberation mechanisms","zh":"民主协商机制","src":"From a macro perspective, democratic deliberation mechanisms strengthen social cohesion and institutional legitimacy.","label":"原文标注"},{"g":"phrase","en":"strengthen social cohesion","zh":"社会凝聚力","src":"From a macro perspective, democratic deliberation mechanisms strengthen social cohesion and institutional legitimacy.","label":"原文标注"},{"g":"phrase","en":"institutional legitimacy","zh":"制度合法性","src":"From a macro perspective, democratic deliberation mechanisms strengthen social cohesion and institutional legitimacy.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, democratic deliberation mechanisms strengthen social cohesion and institutional legitimacy.","label":"整理"},{"g":"pattern","en":"… plays a key role in…","zh":"在……中起关键作用","src":"Educational settings play a vital role in teaching conflict resolution skills.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, conflicting views can reveal potential flaws and overlooked risks in proposed plans.","label":"整理"}],"words":151,"recite":false},{"id":"bx-11wxjf7","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Are most of people’s decisions made in their 20s?","question":"Are most of people’s decisions made in their 20s?","sentences":["A significant proportion of life-defining decisions indeed cluster in people’s twenties, a phenomenon developmental psychology terms emerging adulthood.","During this stage, the prefrontal cortex matures, enhancing long-term planning capabilities.","Materially, individuals typically choose careers, pursue higher education and decide where to reside.","These choices have lasting financial and lifestyle implications.","Cognitively, the twenties are a period of identity exploration and value formation.","People begin to establish personal and professional priorities.","From a macro perspective, societal structures, such as educational systems and job markets, channel young adults into decision-making phases.","However, modern lifespan development theories argue that personal growth continues throughout life.","Many individuals make pivotal decisions later, such as changing careers or starting families.","Ultimately, while the twenties represent a critical period, decision-making is not confined to any single decade.","Therefore, societies should support lifelong learning and flexibility.","Reducing the pressure to have everything figured out young promotes mental health.","A culture that allows for evolving paths fosters greater individual fulfilment."],"expressions":[{"en":"terms emerging adulthood","zh":"初显成年期"},{"en":"prefrontal cortex","zh":"前额叶皮层 "},{"en":"lifestyle implications","zh":"持久的财务和生活方式影响"},{"en":"into decision-making phases","zh":"引导年轻成年人进入决策阶段"},{"en":"evolving paths","zh":"演变路径 "}],"ai":false,"summary":[{"g":"phrase","en":"terms emerging adulthood","zh":"初显成年期","src":"A significant proportion of life-defining decisions indeed cluster in people’s twenties, a phenomenon developmental psychology terms emerging adulthood.","label":"原文标注"},{"g":"phrase","en":"prefrontal cortex","zh":"前额叶皮层","src":"During this stage, the prefrontal cortex matures, enhancing long-term planning capabilities.","label":"原文标注"},{"g":"phrase","en":"lifestyle implications","zh":"持久的财务和生活方式影响","src":"These choices have lasting financial and lifestyle implications.","label":"原文标注"},{"g":"phrase","en":"into decision-making phases","zh":"引导年轻成年人进入决策阶段","src":"From a macro perspective, societal structures, such as educational systems and job markets, channel young adults into decision-making phases.","label":"原文标注"},{"g":"phrase","en":"evolving paths","zh":"演变路径","src":"A culture that allows for evolving paths fosters greater individual fulfilment.","label":"原文标注"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Ultimately, while the twenties represent a critical period, decision-making is not confined to any single decade.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, societal structures, such as educational systems and job markets, channel young adults into decision-making phases.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, individuals typically choose careers, pursue higher education and decide where to reside.","label":"整理"}],"words":161,"recite":false},{"id":"bx-1qzh8pi","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Which is better, to make a decision quickly or slowly?","question":"Which is better, to make a decision quickly or slowly?","sentences":["The superiority of quick or slow decision-making depends on contextual alignment with the decision timing balance model.","Cognitive psychology’s dual-system theory explains that intuitive, fast thinking suits urgent, low-stakes situations, while deliberate,","slow thinking is essential for complex, high-impact choices.","Materially, rapid decisions in emergencies prevent escalation of crises, whereas hasty choices in major investments often lead to regret.","Cognitively, quick decisions leverage pattern recognition and experience, while slow decisions allow for comprehensive information gathering and risk assessment.","From a macro perspective, organisations that match decision speed to task nature achieve optimal outcomes.","However, chronic indecisiveness wastes opportunities, and chronic impulsivity generates errors.","The key is developing metacognitive awareness to judge which mode a situation requires.","Ultimately, balanced decision-makers adapt their pace to the significance and urgency of the matter.","Therefore, cultivating both intuitive and analytical skills enhances overall judgement.","Training programmes can help individuals improve their timing discernment.","Societies benefit when institutions model thoughtful yet timely decision-making."],"expressions":[{"en":"contextual alignment","zh":"情景适配 "},{"en":"timing balance model","zh":"决策时效平衡模型"},{"en":"escalation of crises","zh":"危机升级"},{"en":"chronic indecisiveness","zh":"慢性犹豫不决 "},{"en":"chronic impulsivity","zh":"长期行事冲动 "}],"ai":false,"summary":[{"g":"phrase","en":"contextual alignment","zh":"情景适配","src":"The superiority of quick or slow decision-making depends on contextual alignment with the decision timing balance model.","label":"原文标注"},{"g":"phrase","en":"timing balance model","zh":"决策时效平衡模型","src":"The superiority of quick or slow decision-making depends on contextual alignment with the decision timing balance model.","label":"原文标注"},{"g":"phrase","en":"escalation of crises","zh":"危机升级","src":"Materially, rapid decisions in emergencies prevent escalation of crises, whereas hasty choices in major investments often lead to regret.","label":"原文标注"},{"g":"phrase","en":"chronic indecisiveness","zh":"慢性犹豫不决","src":"However, chronic indecisiveness wastes opportunities, and chronic impulsivity generates errors.","label":"原文标注"},{"g":"phrase","en":"chronic impulsivity","zh":"长期行事冲动","src":"However, chronic indecisiveness wastes opportunities, and chronic impulsivity generates errors.","label":"原文标注"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Cognitive psychology’s dual-system theory explains that intuitive, fast thinking suits urgent, low-stakes situations, while deliberate,","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, organisations that match decision speed to task nature achieve optimal outcomes.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, rapid decisions in emergencies prevent escalation of crises, whereas hasty choices in major investments often lead to regret.","label":"整理"}],"words":158,"recite":false},{"id":"bx-q01p0f","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it always good to be a popular student at school?","question":"Is it always good to be a popular student at school?","sentences":["Popularity at school presents a double-edged sword regarding social capital.","Educational sociology research indicates that well-liked students often enjoy broader support networks and collaborative opportunities.","Materially, popularity can translate into easier access to information and group activity participation.","Cognitively, social recognition boosts self-esteem and a sense of belonging.","However, the pressure to maintain an image may cause anxiety and distract from academic pursuits.","From a macro perspective, school ecosystems thrive on diverse social roles.","Not every student needs to be the centre of attention;","quiet leaders and supportive peers contribute equally to a healthy environment.","Overemphasis on popularity can foster superficial relationships.","Ultimately, the quality of social connections matters more than the quantity of admirers.","Therefore, students should prioritise authentic friendships over widespread approval.","Educators can promote inclusive cultures that value various forms of contribution.","A balanced social life supports holistic development.","Societies that look beyond popularity cultivate deeper interpersonal respect."],"expressions":[{"en":"look beyond","zh":""},{"en":"over widespread approval","zh":"广泛认可"},{"en":"promote inclusive cultures","zh":"包容性文化 "}],"ai":false,"summary":[{"g":"phrase","en":"look beyond","zh":"看到……之外","src":"Societies that look beyond popularity cultivate deeper interpersonal respect.","label":"原文标注"},{"g":"phrase","en":"over widespread approval","zh":"广泛认可","src":"Therefore, students should prioritise authentic friendships over widespread approval.","label":"原文标注"},{"g":"phrase","en":"promote inclusive cultures","zh":"包容性文化","src":"Educators can promote inclusive cultures that value various forms of contribution.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, school ecosystems thrive on diverse social roles.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, the quality of social connections matters more than the quantity of admirers.","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"However, the pressure to maintain an image may cause anxiety and distract from academic pursuits.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, popularity can translate into easier access to information and group activity participation.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the quality of social connections matters more than the quantity of admirers.","label":"整理"}],"words":151,"recite":false},{"id":"bx-tzx0jl","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Why are some students popular?","question":"Why are some students popular?","sentences":["Student popularity is primarily explained by the interpersonal attraction model in social psychology.","Key traits include kindness, empathy and a sense of humour, rather than merely academic excellence or physical appearance.","Materially, popular students tend to engage actively in group activities, increasing their visibility and interaction frequency.","Cognitively, they demonstrate strong emotional intelligence, such as listening attentively and offering help.","These behaviours foster genuine connections.","From a macro perspective, school cultures that value inclusivity and cooperation amplify positive social dynamics.","However, popularity can sometimes stem from superficial factors like trend-following.","Ultimately, enduring popularity is rooted in authentic, prosocial behaviours.","Educators should encourage students to develop empathy and communication skills.","Therefore, understanding the true basis of popularity helps young people build meaningful relationships.","Peer mentoring programmes can spread these positive social practices.","A school environment that rewards kindness over status benefits all students."],"expressions":[{"en":"stem from","zh":""},{"en":"prosocial behaviours","zh":"亲社会行为"},{"en":"Attentively","zh":""},{"en":"Amplify","zh":""}],"ai":false,"summary":[{"g":"phrase","en":"stem from","zh":"源于","src":"However, popularity can sometimes stem from superficial factors like trend-following.","label":"原文标注"},{"g":"phrase","en":"prosocial behaviours","zh":"亲社会行为","src":"Ultimately, enduring popularity is rooted in authentic, prosocial behaviours.","label":"原文标注"},{"g":"phrase","en":"Attentively","zh":"专注地","src":"Cognitively, they demonstrate strong emotional intelligence, such as listening attentively and offering help.","label":"原文标注"},{"g":"phrase","en":"Amplify","zh":"放大","src":"From a macro perspective, school cultures that value inclusivity and cooperation amplify positive social dynamics.","label":"原文标注"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"Key traits include kindness, empathy and a sense of humour, rather than merely academic excellence or physical appearance.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, school cultures that value inclusivity and cooperation amplify positive social dynamics.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, popular students tend to engage actively in group activities, increasing their visibility and interaction frequency.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, enduring popularity is rooted in authentic, prosocial behaviours.","label":"整理"}],"words":142,"recite":false},{"id":"bx-2bvbsq","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"When do most children begin to make their own decisions?","question":"When do most children begin to make their own decisions?","sentences":["Children typically begin making their own decisions during the early school years, as described by the cognitive autonomy development model.","Developmental psychology indicates that as the prefrontal cortex gradually matures, children gain the capacity for simple choice-making.","Materially, this starts with selecting clothes, toys or snacks.","These small decisions help them practise independence.","Cognitively, the process fosters self-awareness and a sense of agency.","Learning to accept consequences builds responsibility.","From a macro perspective, contemporary educational philosophies advocate for nurturing autonomy from a young age.","Schools increasingly incorporate student choice in learning activities.","However, the extent of decision-making should match the child’s developmental stage.","Overburdening young children with adult decisions can cause anxiety.","Ultimately, a gradual increase in autonomy supports healthy psychological growth.","Therefore, parents and teachers should provide age-appropriate choices.","This scaffolding approach prepares children for future complex decisions.","Societies that respect children’s evolving autonomy raise confident, capable adults."],"expressions":[{"en":"advocate for","zh":""},{"en":"autonomy development model","zh":"认知自主发展阶段模型"},{"en":"sense of agency","zh":"能动性"}],"ai":false,"summary":[{"g":"phrase","en":"advocate for","zh":"倡导，支持","src":"From a macro perspective, contemporary educational philosophies advocate for nurturing autonomy from a young age.","label":"原文标注"},{"g":"phrase","en":"autonomy development model","zh":"认知自主发展阶段模型","src":"Children typically begin making their own decisions during the early school years, as described by the cognitive autonomy development model.","label":"原文标注"},{"g":"phrase","en":"sense of agency","zh":"能动性","src":"Cognitively, the process fosters self-awareness and a sense of agency.","label":"原文标注"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a macro perspective, contemporary educational philosophies advocate for nurturing autonomy from a young age.","label":"整理"},{"g":"pattern","en":"A helps (sb.) do B","zh":"A帮助（某人）做B","src":"These small decisions help them practise independence.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, a gradual increase in autonomy supports healthy psychological growth.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, this starts with selecting clothes, toys or snacks.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, a gradual increase in autonomy supports healthy psychological growth.","label":"整理"}],"words":149,"recite":false},{"id":"bx-11i8hxb","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"When do people normally send gifts to others?","question":"When do people normally send gifts to others?","sentences":["Gift-giving is a universal practice deeply embedded in social rituals.","Cultural anthropology explains that presents serve as tangible expressions of emotional bonds during significant life events.","Materially, people commonly exchange gifts during festivals, birthdays, weddings and childbirth celebrations.","These occasions provide culturally sanctioned opportunities for generosity.","Cognitively, gifts convey gratitude, affection and sympathy.","They strengthen interpersonal connections.","From a macro perspective, gift exchange rituals reinforce social cohesion and cultural continuity.","They help maintain community ties across generations.","However, commercialisation can sometimes overshadow the sentimental value.","Mindful giving focuses on thoughtfulness rather than price.","Ultimately, the essence of gift-giving lies in the emotional message, not the material worth.","Therefore, people should prioritise personalisation and sincerity.","Community events often incorporate gift-sharing to promote inclusivity.","Societies that preserve meaningful gift traditions tend to exhibit stronger social support networks."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"promote sth.","zh":"促进，推动","src":"Community events often incorporate gift-

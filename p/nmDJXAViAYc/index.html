ergenerational bonds,","and a more vibrant community life.","However,","it is important to acknowledge that not all seniors have equal access to resources due to health or economic disparities.","Ultimately,","supporting older people to remain active and involved is not only a matter of individual well-being but also a societal asset.","By creating age-friendly environments, we honor their contributions and enrich the fabric of our communities."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"benefit from","zh":"从……中受益","src":"At a macro level, societies that encourage active aging benefit from reduced healthcare costs, stronger intergenerational bonds,","label":"整理"},{"g":"phrase","en":"access to","zh":"获得……的途径","src":"it is important to acknowledge that not all seniors have equal access to resources due to health or economic disparities.","label":"整理"},{"g":"phrase","en":"promote sth.","zh":"促进，推动","src":"which emphasizes that seniors today are increasingly engaged in meaningful activities that promote health, social connection,","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"supporting older people to remain active and involved is not only a matter of individual well-being but also a societal asset.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, many older adults participate in physical exercises like Tai Chi in parks,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, societies that encourage active aging benefit from reduced healthcare costs, stronger intergenerational bonds,","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance, it is common to see retirees volunteering at local schools or cultural events,","label":"整理"},{"g":"idiom","en":"emphasise → stress","zh":"强调（口语替换）","src":"which emphasizes that seniors today are increasingly engaged in meaningful activities that promote health, social connection,","label":"整理"}],"words":206,"recite":false},{"id":"bx-o055uo","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"83: Is it good for children to make noise?","question":"83: Is it good for children to make noise?","sentences":["Whether children making noise is beneficial is illuminated by the Expressive Development Model,","which views children’s vocalizations and movements as essential components of healthy growth.","Developmental psychology asserts that noise—from laughter and singing to imaginative play sounds—is a natural outlet for emotions and a means of exploring the environment.","From a material perspective, children’s noise often accompanies physical activities like running, building, or playing with noisy toys,","which are crucial for motor skill development and sensory integration.","Cognitively, such expressions foster creativity, language acquisition,","and social skills as children learn to modulate their voices and interact with peers.","For example,","a group of children engaged in a boisterous game of pretend are not only burning energy but also negotiating roles and practicing communication.","At a macro level,","societies that embrace the sounds of childhood tend to have more child-friendly policies and public spaces,","recognizing that suppressing natural expression can hinder emotional well-being.","However, it is equally important to teach children situational awareness—when to be quiet in libraries or during rest times.","Ultimately, within reasonable limits, children’s noise is a sign of a vibrant, healthy developmental process.","By allowing appropriate levels of noise, we nurture confident, expressive, and socially adept individuals."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"Cognitively, such expressions foster creativity, language acquisition,","label":"整理"},{"g":"phrase","en":"social connections","zh":"人际联系","src":"and social skills as children learn to modulate their voices and interact with peers.","label":"整理"},{"g":"phrase","en":"…-friendly / …-driven","zh":"……友好的/……驱动的","src":"societies that embrace the sounds of childhood tend to have more child-friendly policies and public spaces,","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"a group of children engaged in a boisterous game of pretend are not only burning energy but also negotiating roles and practicing communication.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, children’s noise often accompanies physical activities like running, building, or playing with noisy toys,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level,","label":"整理"},{"g":"idiom","en":"essential → a must","zh":"必不可少（口语替换）","src":"which views children’s vocalizations and movements as essential components of healthy growth.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, within reasonable limits, children’s noise is a sign of a vibrant, healthy developmental process.","label":"整理"}],"words":200,"recite":false},{"id":"bx-3gsmcb","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"84: Should children not be allowed to make noise under an…","question":"84: Should children not be allowed to make noise under any circumstances?","sentences":["The question of whether children should ever be allowed to make noise is best addressed by the Contextual Appropriateness Model,","which argues that while absolute silence is neither realistic nor desirable,","children must learn to adapt their volume to different settings.","Educational psychology emphasizes that imposing blanket bans on noise can stifle a child’s natural expressiveness and emotional development.","From a material perspective, there are clearly inappropriate times for noise—such as in hospitals, libraries,","or during formal ceremonies—where quiet is a sign of respect and consideration for others.","However, in playgrounds, homes, or outdoor spaces, noise is a healthy and expected part of childhood.","Cognitively, teaching children to discern these contexts fosters empathy, self-regulation, and social intelligence.","For instance,","a child who learns to whisper in a museum but laugh freely on a soccer field is developing crucial life skills.","At a macro level, societies benefit from balancing individual freedoms with collective harmony,","creating environments where children can thrive without infringing on others’ rights.","Ultimately, the goal is not to eliminate children’s noise but to guide them toward appropriate expression.","By modeling and explaining contextual expectations, adults help raise considerate, confident, and emotionally healthy members of society."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"benefit from","zh":"从……中受益","src":"At a macro level, societies benefit from balancing individual freedoms with collective harmony,","label":"整理"},{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"Cognitively, teaching children to discern these contexts fosters empathy, self-regulation, and social intelligence.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"which argues that while absolute silence is neither realistic nor desirable,","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, there are clearly inappropriate times for noise—such as in hospitals, libraries,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, societies benefit from balancing individual freedoms with collective harmony,","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance,","label":"整理"},{"g":"idiom","en":"emphasise → stress","zh":"强调（口语替换）","src":"Educational psychology emphasizes that imposing blanket bans on noise can stifle a child’s natural expressiveness and emotional development.","label":"整理"}],"words":197,"recite":false},{"id":"bx-13xprt5","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"85: What kinds of noises are there in our life?","question":"85: What kinds of noises are there in our life?","sentences":["The variety of noises in our lives is comprehensively explained by the Acoustic Environment Model,","which categorizes sounds into natural, human-made, and social elements that collectively shape our daily experiences.","Environmental psychology research distinguishes between pleasant auditory inputs—like birdsong, flowing water, or laughter—and unwanted noise pollution from traffic,","construction, or industrial machinery.","From a material perspective, our surroundings constantly bombard us with a mix of these sounds,","each carrying different meanings and effects.","For example, the gentle hum of a coffee shop might enhance creativity,","while the blaring of car horns can elevate stress levels.","Cognitively, our brains filter and interpret these noises, influencing mood, concentration, and even memory recall.","A familiar song can transport us back to a cherished moment,","while persistent loud noise can lead to irritability or health issues.","At a macro level, understanding this acoustic diversity is vital for urban planning and public health.","Cities that invest in noise-reducing infrastructure, green belts, and soundscapes design demonstrate a commitment to citizens’ well-being.","Ultimately, while we cannot eliminate all noise, we can learn to appreciate beneficial sounds and mitigate harmful ones.","By becoming more aware of our acoustic environment, we can create healthier, more harmonious spaces for living and working."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"noise pollution","zh":"噪音污染","src":"Environmental psychology research distinguishes between pleasant auditory inputs—like birdsong, flowing water, or laughter—and unwanted noise pollution from traffic,","label":"整理"},{"g":"phrase","en":"enhance sth.","zh":"提升","src":"For example, the gentle hum of a coffee shop might enhance creativity,","label":"整理"},{"g":"phrase","en":"lead to","zh":"导致","src":"while persistent loud noise can lead to irritability or health issues.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Ultimately, while we cannot eliminate all noise, we can learn to appreciate beneficial sounds and mitigate harmful ones.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, our surroundings constantly bombard us with a mix of these sounds,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, understanding this acoustic diversity is vital for urban planning and public health.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, while we cannot eliminate all noise, we can learn to appreciate beneficial sounds and mitigate harmful ones.","label":"整理"},{"g":"idiom","en":"enhance → boost","zh":"提升（口语替换）","src":"For example, the gentle hum of a coffee shop might enhance creativity,","label":"整理"}],"words":202,"recite":false},{"id":"bx-12dvhna","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"When do people like to hold a party?","question":"When do people like to hold a party?","sentences":["People hold parties not merely for entertainment, but as vital punctuation marks in life’s rhythm.","Birthdays, holidays, and even casual weekends serve as emotional reset points, strengthening social bonds and recharging spirits.","Materially, festive decorations, shared meals, and music create a sensory haven; cognitively,","these gatherings fulfill our deep need for belonging and empathy.","At a macro level,","public holidays and urban lifestyles shape when we celebrate—weekends offer a gentle pause from the daily grind,","while cultural festivals like Spring Festival unite entire nations.","Psychologically, parties act as “healing cabins” where laughter and inclusion dissolve stress.","Some prefer meticulously planned events for a sense of control, while others cherish spontaneous gatherings for their authenticity.","Neither is superior; the timing simply reflects one’s current life stage and emotional needs.","In a world that often feels rushed, parties remind us to pause, connect,","and celebrate the simple joy of being together."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"a sense of …","zh":"……感","src":"Some prefer meticulously planned events for a sense of control, while others cherish spontaneous gatherings for their authenticity.","label":"整理"},{"g":"phrase","en":"social connections","zh":"人际联系","src":"Birthdays, holidays, and even casual weekends serve as emotional reset points, strengthening social bonds and recharging spirits.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level,","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"People hold parties not merely for entertainment, but as vital punctuation marks in life’s rhythm.","label":"整理"},{"g":"pattern","en":"…, for example, …（举例）","zh":"比如……","src":"while cultural festivals like Spring Festival unite entire nations.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, festive decorations, shared meals, and music create a sensory haven; cognitively,","label":"整理"},{"g":"idiom","en":"Cognitively, → In terms of how we think,","zh":"从认知上（口语改写）","src":"Materially, festive decorations, shared meals, and music create a sensory haven; cognitively,","label":"整理"}],"words":149,"recite":false},{"id":"bx-uikxyk","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Do most people prefer to hold a party in a public place o…","question":"Do most people prefer to hold a party in a public place or a private place?","sentences":["The choice between public and private party venues reflects a fundamental trade-off between convenience and intimacy.","Public places like banquet halls offer professional service and a festive vibe,","ideal for large celebrations where hosts wish to minimize logistical stress.","Conversely, private spaces such as homes provide a sense of safety and authenticity, fostering deeper connections among close friends.","Materially, public venues boast better facilities, while private ones carry personal touches like family photos or home-cooked aromas.","Cognitively, the former stimulates extroversion and social expansion, while the latter nurtures trust and vulnerability.","At a macro level, urbanization and rising living costs push many toward rented spaces, yet in tightly-knit communities,","home gatherings remain the heart of social life.","Neither is universally better; the decision hinges on the occasion’s purpose and guests’ personalities.","Ultimately, a party’s success lies not in its location, but in the warmth of human connection it cultivates."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"Conversely, private spaces such as homes provide a sense of safety and authenticity, fostering deeper connections among close friends.","label":"整理"},{"g":"phrase","en":"cultivate sth.","zh":"培养","src":"Ultimately, a party’s success lies not in its location, but in the warmth of human connection it cultivates.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, urbanization and rising living costs push many toward rented spaces, yet in tightly-knit communities,","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, a party’s success lies not in its location, but in the warmth of human connection it cultivates.","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"At a macro level, urbanization and rising living costs push many toward rented spaces, yet in tightly-knit communities,","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, public venues boast better facilities, while private ones carry personal touches like family photos or home-cooked aromas.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, a party’s success lies not in its location, but in the warmth of human connection it cultivates.","label":"整理"}],"words":149,"recite":false},{"id":"bx-3ntbm5","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Do most people prefer to hold a party in a restaurant or …","question":"Do most people prefer to hold a party in a restaurant or in a pub?","sentences":["Restaurants and pubs cater to distinct social tones, each serving as a unique container for human connection.","Restaurants, with their curated menus and attentive service, suit celebratory meals and family-style bonding,","offering a sense of ritual and nourishment.","Pubs, with their relaxed ambiance and casual drinks, fit informal gatherings where friends unwind and express themselves freely.","Materially, one provides gourmet experiences, the other affordable beverages and lively backgrounds.","Cognitively, dining out fulfills a need to be cared for, while a pub visit allows for emotional release and authenticity.","Macro trends like the night-time economy boom have normalized bar culture,","while smaller household sizes make restaurants extensions of the home kitchen.","Neither is superior; the preference simply aligns with the occasion’s intent.","A birthday might call for an elegant dinner, whereas a Friday night might demand a carefree toast.","Ultimately, both venues enrich our social tapestry,","reminding us that joy can be found in both refined flavors and shared laughter."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"cater to","zh":"迎合，满足","src":"Restaurants and pubs cater to distinct social tones, each serving as a unique container for human connection.","label":"整理"},{"g":"phrase","en":"social tone","zh":"社交氛围","src":"Restaurants and pubs cater to distinct social tones, each serving as a unique container for human connection.","label":"整理"},{"g":"pattern","en":"…, each serving as…","zh":"各自充当……","src":"Restaurants and pubs cater to distinct social tones, each serving as a unique container for human connection.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, both venues enrich our social tapestry,","label":"整理"},{"g":"pattern","en":"…, for example, …（举例）","zh":"比如……","src":"Macro trends like the night-time economy boom have normalized bar culture,","label":"整理"},{"g":"idiom","en":"unwind","zh":"放松","src":"Pubs, with their relaxed ambiance and casual drinks, fit informal gatherings where friends unwind and express themselves freely.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, one provides gourmet experiences, the other affordable beverages and lively backgrounds.","label":"整理"}],"words":159,"recite":false},{"id":"bx-13lprll","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What special events are celebrated in China?","question":"What special events are celebrated in China?","sentences":["China’s special events are vibrant threads in the nation’s cultural fabric, weaving together history, family, and seasonal rhythms.","The Spring Festival, with its reunion dinners, symbolizes unity and renewal; the Mid-Autumn Festival, through mooncakes,","carries blessings of togetherness; Dragon Boat races honor loyalty and community spirit.","Materially, these celebrations involve festive foods, red envelopes, and decorations,","but their essence lies in spiritual renewal—strengthening family bonds, expressing gratitude, and reinforcing cultural identity.","At a macro level, the government’s holiday policies and UNESCO recognition safeguard these traditions,","boosting both domestic tourism and global cultural exchange.","Beyond traditional festivals, modern events like National Day and even Singles’ Day reflect evolving social values and consumer culture.","Each event, whether ancient or contemporary, serves as a collective heartbeat, reminding people of their roots while embracing progress.","In celebrating, Chinese society nurtures social cohesion, intergenerational support, and a shared sense of belonging."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"reinforce sth.","zh":"强化","src":"but their essence lies in spiritual renewal—strengthening family bonds, expressing gratitude, and reinforcing cultural identity.","label":"整理"},{"g":"phrase","en":"a sense of …","zh":"……感","src":"In celebrating, Chinese society nurtures social cohesion, intergenerational support, and a shared sense of belonging.","label":"整理"},{"g":"phrase","en":"social connections","zh":"人际联系","src":"In celebrating, Chinese society nurtures social cohesion, intergenerational support, and a shared sense of belonging.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, the government’s holiday policies and UNESCO recognition safeguard these traditions,","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"but their essence lies in spiritual renewal—strengthening family bonds, expressing gratitude, and reinforcing cultural identity.","label":"整理"},{"g":"pattern","en":"…, for example, …（举例）","zh":"比如……","src":"Beyond traditional festivals, modern events like National Day and even Singles’ Day reflect evolving social values and consumer culture.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, these celebrations involve festive foods, red envelopes, and decorations,","label":"整理"},{"g":"idiom","en":"Cognitively, → In terms of how we think,","zh":"从认知上（口语改写）","src":"Materially, these celebrations involve festive foods, red envelopes, and decorations,","label":"整理"}],"words":146,"recite":false},{"id":"bx-g2ob56","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Are old buildings valuable?","question":"Are old buildings valuable?","sentences":["Old buildings are far more than decaying structures; they are tangible vessels of collective memory and cultural continuity.","Their value lies in their ability to anchor us in a rapidly changing world,","offering a sense of identity and belonging.","Materially, they showcase traditional craftsmanship and architectural aesthetics that modern constructions often lack.","Cognitively, they serve as “living textbooks” for education, sparking curiosity about history and fostering community pride.","At a macro level,","heritage preservation policies and urban renewal strategies increasingly recognize that demolishing all old buildings would erase a city’s soul.","Fields like tourism benefit from their unique charm, while residents gain emotional comfort from familiar landmarks.","Some argue for redevelopment to meet economic needs,","but adaptive reuse—transforming a historic school into a museum or a tea house into a café—demonstrates that preservation and progress can coexist.","Ultimately,","old buildings remind us that a society’s worth is measured not only by its future ambitions but also by how it honors its past."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"adaptive reuse","zh":"（旧建筑）适应性再利用","src":"but adaptive reuse—transforming a historic school into a museum or a tea house into a café—demonstrates that preservation and progress can coexist.","label":"整理"},{"g":"phrase","en":"benefit from","zh":"从……中受益","src":"Fields like tourism benefit from their unique charm, while residents gain emotional comfort from familiar landmarks.","label":"整理"},{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"Cognitively, they serve as “living textbooks” for education, sparking curiosity about history and fostering community pride.","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"old buildings remind us that a society’s worth is measured not only by its future ambitions but also by how it honors its past.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level,","label":"整理"},{"g":"pattern","en":"Not only…, but…","zh":"不仅……而且……","src":"old buildings remind us that a society’s worth is measured not only by its future ambitions but also by how it honors its past.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, they showcase traditional craftsmanship and architectural aesthetics that modern constructions often lack.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately,","label":"整理"}],"words":162,"recite":false},{"id":"bx-lo5duz","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Should all old buildings be demolished?","question":"Should all old buildings be demolished?","sentences":["The notion of demolishing all old buildings is a shortsighted approach that would sever a city’s historical continuity.","While some structures may be unsafe or obsolete, a blanket demolition policy ignores the profound cultural, environmental,","and social value these buildings hold.","Materially, they represent irreplaceable craftsmanship and spatial wisdom; cognitively,","they provide a sense of place and identity that new developments struggle to replicate.","At a macro level,","sustainable urban renewal strategies worldwide now emphasize “conservation before demolition,” recognizing that adaptive reuse reduces construction waste and preserves community heritage.","Economically, revitalizing old buildings can stimulate local businesses and tourism, while socially,","they serve as gathering spaces that strengthen neighborhood bonds.","Ethically, we have a duty to pass on this legacy to future generations.","Of course, pragmatic assessments are necessary—some buildings may indeed make way for infrastructure—but the default should be preservation.","A city that cherishes its old buildings demonstrates not weakness, but a mature confidence in its layered identity."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"sever sth.","zh":"切断","src":"The notion of demolishing all old buildings is a shortsighted approach that would sever a city’s historical continuity.","label":"整理"},{"g":"phrase","en":"adaptive reuse","zh":"（旧建筑）适应性再利用","src":"sustainable urban renewal strategies worldwide now emphasize “conservation before demolition,” recognizing that adaptive reuse reduces construction waste and preserves community heritage.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While some structures may be unsafe or obsolete, a blanket demolition policy ignores the profound cultural, environmental,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level,","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"Of course, pragmatic assessments are necessary—some buildings may indeed make way for infrastructure—but the default should be preservation.","label":"整理"},{"g":"idiom","en":"Of course.","zh":"当然","src":"Of course, pragmatic assessments are necessary—some buildings may indeed make way for infrastructure—but the default should be preservation.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, they represent irreplaceable craftsmanship and spatial wisdom; cognitively,","label":"整理"}],"words":159,"recite":false},{"id":"bx-1ivlqwi","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Why are some students popular in school?","question":"Why are some students popular in school?","sentences":["Popularity in school is less about superficial charm and more about emotional intelligence—the ability to make others feel seen,","valued, and included.","Students who listen actively, share joy, and include newcomers naturally attract peers.","Materially, good grooming and talents like sports or art can initially draw attention, but cognitively, it is kindness,","empathy, and authenticity that sustain long-term connections.","At a macro level, school environments that encourage collaborative learning and value diversity tend to foster healthier popularity dynamics.","Psychologically, popular students often exhibit high self-awareness and adaptability, serving as positive role models.","However, true popularity should never rely on exclusion or aggression; inclusive leadership benefits the entire community.","Some students gain influence through humor, others through reliability or even quiet strength.","Each style reflects different social needs, and all can contribute to a vibrant school culture.","Ultimately, the most admired students are those whose success uplifts others, creating a ripple effect of kindness and belonging."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"contribute to","zh":"促成，有助于","src":"Each style reflects different social needs, and all can contribute to a vibrant school culture.","label":"整理"},{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"At a macro level, school environments that encourage collaborative learning and value diversity tend to foster healthier popularity dynamics.","label":"整理"},{"g":"phrase","en":"long-term …","zh":"长期的……","src":"empathy, and authenticity that sustain long-term connections.","label":"整理"},{"g":"pattern","en":"A makes B feel…","zh":"A让B感觉……","src":"Popularity in school is less about superficial charm and more about emotional intelligence—the ability to make others feel seen,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, school environments that encourage collaborative learning and value diversity tend to foster healthier popularity dynamics.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, the most admired students are those whose success uplifts others, creating a ripple effect of kindness and belonging.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, good grooming and talents like sports or art can initially draw attention, but cognitively, it is kindness,","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the most admired students are those whose success uplifts others, creating a ripple effect of kindness and belonging.","label":"整理"}],"words":155,"recite":false},{"id":"bx-17xxdv8","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it important for a teacher to be popular?","question":"Is it important for a teacher to be popular?","sentences":["While being popular is not an explicit goal for teachers, it serves as a powerful catalyst for educational influence.","When students like and trust a teacher, they are more engaged, less anxious, and more willing to embrace challenges.","Materially, a positive rapport can translate into better classroom behavior and academic performance.","Cognitively, it reduces the affective filter—the emotional barrier to learning—allowing students to absorb knowledge more freely.","At a macro level, educational research consistently links strong teacher-student relationships with improved outcomes,","prompting schools to prioritize social-emotional learning alongside academics.","However, popularity should not be confused with leniency;","a teacher who is kind yet firm often earns deeper respect than one who merely entertains.","The healthiest form of popularity stems from authenticity, fairness, and a genuine passion for nurturing young minds.","Ultimately, a beloved teacher plants seeds of curiosity that flourish long after the final bell,","proving that warmth and authority can harmoniously coexist."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"stem from","zh":"源于","src":"The healthiest form of popularity stems from authenticity, fairness, and a genuine passion for nurturing young minds.","label":"整理"},{"g":"phrase","en":"prioritise sth.","zh":"优先考虑","src":"prompting schools to prioritize social-emotional learning alongside academics.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While being popular is not an explicit goal for teachers, it serves as a powerful catalyst for educational influence.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, educational research consistently links strong teacher-student relationships with improved outcomes,","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, a beloved teacher plants seeds of curiosity that flourish long after the final bell,","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, a positive rapport can translate into better classroom behavior and academic performance.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, a beloved teacher plants seeds of curiosity that flourish long after the final bell,","label":"整理"}],"words":153,"recite":false},{"id":"bx-d9s29g","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Are good teachers always popular among students?","question":"Are good teachers always popular among students?","sentences":["Good teachers are not always popular in the traditional sense,","because true education often requires pushing students beyond their comfort zones.","Like medicine that tastes bitter but heals, effective teaching sometimes involves high expectations, rigorous feedback, and temporary discomfort.","Materially, this might manifest as challenging assignments or strict classroom management.","Cognitively, students may initially resist, but over time, they develop resilience, critical thinking, and a growth mindset.","At a macro level, educational paradigms are shifting:","while past eras idolized stern “disciplinarians,” today’s emphasis on student well-being has elevated the value of approachable educators.","Yet,","research shows that the most impactful teachers combine high challenge with high support—a balance that may not always win immediate popularity contests.","Some educators naturally charm their classes, while others, though less immediately likable, earn profound gratitude years later.","Ultimately, a teacher’s worth is measured not by applause in the moment,","but by the lifelong difference they make in their students’ lives."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"critical thinking","zh":"批判性思维","src":"Cognitively, students may initially resist, but over time, they develop resilience, critical thinking, and a growth mindset.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"while past eras idolized stern “disciplinarians,” today’s emphasis on student well-being has elevated the value of approachable educators.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, educational paradigms are shifting:","label":"整理"},{"g":"pattern","en":"Although…, …","zh":"虽然……，但……","src":"Some educators naturally charm their classes, while others, though less immediately likable, earn profound gratitude years later.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, this might manifest as challenging assignments or strict classroom management.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, a teacher’s worth is measured not by applause in the moment,","label":"整理"}],"words":156,"recite":false},{"id":"bx-xthi2c","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What are the qualities of being a good teacher?","question":"What are the qualities of being a good teacher?","sentences":["A good teacher embodies a harmonious blend of professional competence and human warmth.","Core qualities include patience, passion, adaptability, and the ability to ignite curiosity.","Materially, they prepare clear lesson plans, utilize diverse teaching aids, and provide constructive feedback.","Cognitively, they tailor their approach to different learning styles,","explaining concepts in multiple ways until students’ eyes light up with understanding.","At a macro level,","national teaching standards emphasize not only subject mastery but also moral integrity and compassion—the “four virtues” of ideal educators.","Psychologically, effective teachers create a safe, inclusive environment where mistakes are seen as learning opportunities.","They listen actively, encourage questions, and celebrate progress, fostering both academic and emotional growth.","Socially, they model respect, collaboration, and lifelong learning.","Importantly, good teaching is not one-size-fits-all; an elementary teacher might use playfulness and storytelling,","while a university professor might challenge students with Socratic dialogue.","Regardless of context, the essence remains:","a great teacher empowers students to discover their own potential and face the world with confidence."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"regardless of the circumstances","zh":"无论情况如何","src":"Regardless of context, the essence remains:","label":"整理"},{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"They listen actively, encourage questions, and celebrate progress, fostering both academic and emotional growth.","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"national teaching standards emphasize not only subject mastery but also moral integrity and compassion—the “four virtues” of ideal educators.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level,","label":"整理"},{"g":"pattern","en":"Not only…, but…","zh":"不仅……而且……","src":"national teaching standards emphasize not only subject mastery but also moral integrity and compassion—the “four virtues” of ideal educators.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, they prepare clear lesson plans, utilize diverse teaching aids, and provide constructive feedback.","label":"整理"},{"g":"idiom","en":"emphasise → stress","zh":"强调（口语替换）","src":"national teaching standards emphasize not only subject mastery but also moral integrity and compassion—the “four virtues” of ideal educators.","label":"整理"}],"words":166,"recite":false},{"id":"bx-1k1sjsh","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it easier to become popular nowadays?","question":"Is it easier to become popular nowadays?","sentences":["The digital age has undeniably lowered the barrier to visibility—anyone with a smartphone can now broadcast their life to millions.","Yet, while gaining fleeting attention is easier, achieving genuine, lasting popularity remains as challenging as ever.","Materially, social media platforms offer instant reach through viral algorithms, but cognitively, true influence demands authenticity, empathy,","and consistent value creation.","At a macro level, the attention economy rewards sensationalism, yet society increasingly craves substance over clicks,","prompting movements like “positive internet culture” and “anti-toxic fandom.” Psychologically,","the pursuit of likes can become an addictive treadmill,","but those who focus on meaningful connection rather than mere metrics often build more loyal communities.","Some individuals leverage their platform for social good, while others chase ephemeral fame.","Ultimately, technology has made it simpler to be seen, but not necessarily to be understood or appreciated.","The most enduring popularity still arises from the timeless human qualities of kindness, integrity, and the courage to be real."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"focus on","zh":"专注于","src":"but those who focus on meaningful connection rather than mere metrics often build more loyal communities.","label":"整理"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"but those who focus on meaningful connection rather than mere metrics often build more loyal communities.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Yet, while gaining fleeting attention is easier, achieving genuine, lasting popularity remains as challenging as ever.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, the attention economy rewards sensationalism, yet society increasingly craves substance over clicks,","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, social media platforms offer instant reach through viral algorithms, but cognitively, true influence demands authenticity, empathy,","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, technology has made it simpler to be seen, but not necessarily to be understood or appreciated.","label":"整理"}],"words":158,"recite":false},{"id":"bx-6q4uzl","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Why do people want to be popular?","question":"Why do people want to be popular?","sentences":["The desire to be popular is deeply rooted in our evolutionary need for belonging and social connection.","At its healthiest,","it reflects a wish to contribute positively to a community and to be recognized for one’s authentic self.","Materially, popularity can open doors to opportunities, friendships, and even career advancement.","Cognitively, it satisfies fundamental psychological needs for acceptance and self-esteem, as outlined in Maslow’s hierarchy.","At a macro level, consumer culture and social media often amplify this desire,","equating popularity with success and fueling a constant quest for validation.","However, a balanced perspective recognizes that true fulfillment comes not from chasing applause,","but from cultivating genuine relationships and inner worth.","Education and parenting play key roles in helping individuals distinguish between healthy self-confidence and destructive people-pleasing.","Ultimately, the healthiest form of popularity is a byproduct of living with integrity, kindness,","and purpose—qualities that naturally draw others toward us without compromising our true identity."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"be rooted in","zh":"根植于","src":"The desire to be popular is deeply rooted in our evolutionary need for belonging and social connection.","label":"整理"},{"g":"phrase","en":"cultivate sth.","zh":"培养","src":"but from cultivating genuine relationships and inner worth.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, consumer culture and social media often amplify this desire,","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, the healthiest form of popularity is a byproduct of living with integrity, kindness,","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"However, a balanced perspective recognizes that true fulfillment comes not from chasing applause,","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, popularity can open doors to opportunities, friendships, and even career advancement.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the healthiest form of popularity is a byproduct of living with integrity, kindness,","label":"整理"}],"words":153,"recite":false},{"id":"bx-23mwok","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Should students have physical education and do sports at …","question":"Should students have physical education and do sports at school?","sentences":["Physical education and school sports are not mere extracurricular add-ons; they are essential components of holistic development.","Materially, regular exercise builds cardiovascular health, muscular strength, and coordination, laying the foundation for a lifetime of physical well-being.","Cognitively, sports teach resilience, strategic thinking, and emotional regulation—skills that directly enhance academic performance and mental health.","At a macro level,","national policies like “Double Reduction” aim to rebalance education by reducing academic burdens and increasing physical activity,","recognizing that a healthy student body is a cornerstone of social productivity.","Psychologically, team sports foster social skills, empathy, and a sense of belonging, while individual activities promote self-discipline and mindfulness.","Economically, investing in youth fitness reduces future healthcare costs and cultivates a more energetic workforce.","Importantly, sports should be inclusive, offering both competitive and recreational pathways so every student can discover the joy of movement.","Ultimately, physical education shapes not just bodies, but character,","equipping young people with the vitality and values to thrive in all aspects of life."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"Psychologically, team sports foster social skills, empathy, and a sense of belonging, while individual activities promote self-discipline and mindfulness.","label":"整理"},{"g":"phrase","en":"cultivate sth.","zh":"培养","src":"Economically, investing in youth fitness reduces future healthcare costs and cultivates a more energetic workforce.","label":"整理"},{"g":"phrase","en":"promote sth.","zh":"促进，推动","src":"Psychologically, team sports foster social skills, empathy, and a sense of belonging, while individual activities promote self-discipline and mindfulness.","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"Ultimately, physical education shapes not just bodies, but character,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level,","label":"整理"},{"g":"pattern","en":"By doing…, …","zh":"通过做……","src":"national policies like “Double Reduction” aim to rebalance education by reducing academic burdens and increasing physical activity,","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, regular exercise builds cardiovascular health, muscular strength, and coordination, laying the foundation for a lifetime of physical well-being.","label":"整理"},{"g":"idiom","en":"Economically, → Money-wise,","zh":"经济上（口语改写）","src":"Economically, investing in youth fitness reduces future healthcare costs and cultivates a more energetic workforce.","label":"整理"}],"words":164,"recite":false},{"id":"bx-tsnbaa","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What qualities should an athlete have?","question":"What qualities should an athlete have?","sentences":["An athlete’s journey to excellence demands a rare fusion of physical prowess and mental fortitude.","Core qualities include discipline, mental toughness, teamwork, and humility.","Materially, athletes must cultivate strength, speed, and technical precision through years of deliberate practice.","Cognitively, they develop laser-like focus, the ability to perform under immense pressure, and resilience to bounce back from setbacks.","At a macro level, national sports systems emphasize not only gold medals but also character building,","expecting athletes to serve as role models who embody fair play and sportsmanship.","Psychologically, traits like growth mindset and emotional intelligence enable them to handle both victory and defeat with grace.","Socially, team athletes learn to subordinate ego for collective success, while individual competitors master self-reliance.","Ethically, integrity—such as competing clean and respecting opponents—is non-negotiable.","Ultimately, the greatest athletes are those who transcend statistics, inspiring others through their dedication, humility,","and unwavering passion for their sport."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"mental fortitude","zh":"心理韧性","src":"An athlete’s journey to excellence demands a rare fusion of physical prowess and mental fortitude.","label":"整理"},{"g":"phrase","en":"cultivate sth.","zh":"培养","src":"Materially, athletes must cultivate strength, speed, and technical precision through years of deliberate practice.","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"At a macro level, national sports systems emphasize not only gold medals but also character building,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, national sports systems emphasize not only gold medals but also character building,","label":"整理"},{"g":"pattern","en":"A allows/enables sb. to do B","zh":"A使某人能够做B","src":"Psychologically, traits like growth mindset and emotional intelligence enable them to handle both victory and defeat with grace.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, athletes must cultivate strength, speed, and technical precision through years of deliberate practice.","label":"整理"},{"g":"idiom","en":"emphasise → stress","zh":"强调（口语替换）","src":"At a macro level, national sports systems emphasize not only gold medals but also character building,","label":"整理"}],"words":149,"recite":false},{"id":"bx-1a2jw9q","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is talent important in sports?","question":"Is talent important in sports?","sentences":["Talent in sports is a precious head start, but it is far from a guarantee of success.","Like a seed with genetic potential, it requires the right environment, relentless nurturing, and time to flourish.","Materially, natural attributes such as height, fast-twitch muscle fibers, or cardiovascular efficiency provide an initial advantage.","Cognitively, however, it is qualities like grit, adaptability, and a growth mindset that determine how far an athlete can go.","At a macro level, sports systems worldwide invest heavily in talent identification,","yet history is replete with “late bloomers” who outperformed early prodigies through superior work ethic and mental resilience.","Psychological research confirms that deliberate practice—not just innate ability—drives expertise.","Moreover, social factors like access to coaching, family support, and cultural encouragement often tip the scales.","Ultimately, while talent may open the door to elite competition, it is passion, perseverance,","and purposeful training that allow an athlete to walk through it and reach the podium."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"access to","zh":"获得……的途径","src":"Moreover, social factors like access to coaching, family support, and cultural encouragement often tip the scales.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Ultimately, while talent may open the door to elite competition, it is passion, perseverance,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, sports systems worldwide invest heavily in talent identification,","label":"整理"},{"g":"pattern","en":"A allows/enables sb. to do B","zh":"A使某人能够做B","src":"and purposeful training that allow an athlete to walk through it and reach the podium.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, natural attributes such as height, fast-twitch muscle fibers, or cardiovascular efficiency provide an initial advantage.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, while talent may open the door to elite competition, it is passion, perseverance,","label":"整理"}],"words":155,"recite":false},{"id":"bx-114d4ow","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it easy to identify children’s talents?","question":"Is it easy to identify children’s talents?","sentences":["Identifying children’s talents is a delicate, often imprecise endeavor, because gifts manifest at varying paces and in diverse forms.","Unlike a light switch, talent is more like a seed that requires the right soil, sunlight, and time to sprout.","Materially, some abilities—such as perfect pitch or exceptional agility—may surface early, but many others, like leadership, empathy,","or innovative thinking, unfold gradually.","Cognitively, children’s interests can be mistaken for talents, and vice versa;","a child who doodles idly might be a future artist,","while a quiet observer could develop into a strategic thinker.","At a macro level, traditional education systems, with their emphasis on standardized testing, often overlook non-academic intelligences,","prompting a global shift toward multiple intelligences frameworks.","Parents and educators must resist the urge to label or specialize too soon, instead providing rich,","varied experiences that allow different potentials to emerge.","Ultimately, the goal is not to prematurely categorize children,","but to cultivate an environment where every seed can find its season and bloom."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"cultivate sth.","zh":"培养","src":"but to cultivate an environment where every seed can find its season and bloom.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, traditional education systems, with their emphasis on standardized testing, often overlook non-academic intelligences,","label":"整理"},{"g":"pattern","en":"A allows/enables sb. to do B","zh":"A使某人能够做B","src":"varied experiences that allow different potentials to emerge.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, the goal is not to prematurely categorize children,","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, some abilities—such as perfect pitch or exceptional agility—may surface early, but many others, like leadership, empathy,","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, the goal is not to prematurely categorize children,","label":"整理"}],"words":164,"recite":false},{"id":"bx-1x36xeb","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What is the most popular sport in China?","question":"What is the most popular sport in China?","sentences":["The most popular sport in China is arguably table tennis, a national pastime that unites generations and social classes.","Its accessibility—requiring minimal space and equipment—makes it a ubiquitous presence in parks, schools, and community centers.","Materially, the sport’s infrastructure is unparalleled, with ping-pong tables dotting the urban and rural landscape alike.","Cognitively, it embodies values of agility, precision, and strategic thinking,","while its historical role in “ping-pong diplomacy” adds layers of cultural pride.","At a macro level, the sport’s dominance is reinforced by decades of state investment and international success,","fostering a collective sense of achievement.","However, China’s sporting landscape is diversifying: badminton enjoys massive participation, basketball captivates urban youth,","and soccer is rising through policy support.","Each sport reflects different demographics—older adults may prefer tai chi or table tennis, while teenagers flock to basketball courts.","Ultimately,","the popularity of any sport in China is rooted in its ability to serve as a shared language of health,","joy, and national identity."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"be rooted in","zh":"根植于","src":"the popularity of any sport in China is rooted in its ability to serve as a shared language of health,","label":"整理"},{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"fostering a collective sense of achievement.","label":"整理"},{"g":"phrase","en":"a sense of …","zh":"……感","src":"fostering a collective sense of achievement.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, the sport’s dominance is reinforced by decades of state investment and international success,","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately,","label":"整理"},{"g":"pattern","en":"However, …（转折）","zh":"然而……","src":"However, China’s sporting landscape is diversifying: badminton enjoys massive participation, basketball captivates urban youth,","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, the sport’s infrastructure is unparalleled, with ping-pong tables dotting the urban and rural landscape alike.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately,","label":"整理"}],"words":161,"recite":false},{"id":"bx-gfgebh","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What are there so few top athletes?","question":"What are there so few top athletes?","sentences":["The scarcity of top athletes is a mathematical and physiological reality:","reaching the pinnacle of sports demands an extraordinary convergence of genetics, relentless training, mental fortitude, and serendipitous opportunity.","Materially,","only a tiny fraction of the population possesses the ideal biological attributes—such as fast-twitch muscle fibers or cardiovascular efficiency—required for elite performance.","Even among the gifted, years of grueling, scientifically optimized training are essential.","Cognitively, the ability to perform under crushing pressure, maintain focus, and rebound from failure separates the good from the great.","At a macro level, national sports systems can identify and nurture talent,","but global competition ensures that only a handful reach the very top.","Economic barriers, early specialization pressures, and the sheer randomness of injuries further thin the ranks.","Yet, this rarity does not diminish the value of sports for all.","While few become Olympic champions,","the pursuit of personal bests and the joy of movement make every participant a winner in their own right.","Ultimately, elite athletes inspire us not because they are many, but because they show what is humanly possible."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"mental fortitude","zh":"心理韧性","src":"reaching the pinnacle of sports demands an extraordinary convergence of genetics, relentless training, mental fortitude, and serendipitous opportunity.","label":"整理"},{"g":"phrase","en":"perform under pressure","zh":"在压力下发挥","src":"Cognitively, the ability to perform under crushing pressure, maintain focus, and rebound from failure separates the good from the great.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While few become Olympic champions,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, national sports systems can identify and nurture talent,","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, elite athletes inspire us not because they are many, but because they show what is humanly possible.","label":"整理"},{"g":"idiom","en":"separate the good from the great","zh":"区分优秀与卓越","src":"Cognitively, the ability to perform under crushing pressure, maintain focus, and rebound from failure separates the good from the great.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially,","label":"整理"}],"words":177,"recite":false},{"id":"bx-c8x1wr","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Are there any natural attractions that are great to visit?","question":"Are there any natural attractions that are great to visit?","sentences":["Natural attractions are undoubtedly wonderful to visit, and this can be explained by the Attention Restoration Theory in environmental psychology.","Unlike urban environments that demand constant directed attention, natural settings like ancient forests, serene lakes,","or majestic mountains engage our minds through \"soft fascination.\" This allows our cognitive resources to replenish,","reducing mental fatigue and boosting creativity.","For example,","a simple walk along a tree-lined trail can lower cortisol levels and improve mood far more effectively than a busy shopping mall.","From a material perspective, these attractions offer clean air, biodiversity, and stunning vistas that are increasingly rare in concrete jungles.","Cognitively, they provide a sense of awe and perspective, helping visitors detach from daily worries.","At a macro level, the rise of eco-tourism not only supports local economies but also fosters environmental awareness among travelers.","Some might argue that natural sites are less convenient than theme parks, but their long-term benefits for well-being are irreplaceable.","Ultimately, visiting natural attractions is a gentle reminder that humans are part of nature, not separate from it.","Therefore, integrating such trips into our lives can lead to a more balanced, harmonious existence.","With proper conservation, these treasures will continue to heal and inspire generations to come."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"At a macro level, the rise of eco-tourism not only supports local economies but also fosters environmental awareness among travelers.","label":"整理"},{"g":"phrase","en":"long-term …","zh":"长期的……","src":"Some might argue that natural sites are less convenient than theme parks, but their long-term benefits for well-being are irreplaceable.","label":"整理"},{"g":"phrase","en":"lead to","zh":"导致","src":"Therefore, integrating such trips into our lives can lead to a more balanced, harmonious existence.","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"At a macro level, the rise of eco-tourism not only supports local economies but also fosters environmental awareness among travelers.","label":"整理"},{"g":"pattern","en":"From a … perspective, …","zh":"从……角度来看","src":"From a material perspective, these attractions offer clean air, biodiversity, and stunning vistas that are increasingly rare in concrete jungles.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, the rise of eco-tourism not only supports local economies but also fosters environmental awareness among travelers.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, visiting natural attractions is a gentle reminder that humans are part of nature, not separate from it.","label":"整理"},{"g":"idiom","en":"Therefore → So,","zh":"所以（口语里更常用 So）","src":"Therefore, integrating such trips into our lives can lead to a more balanced, harmonious existence.","label":"整理"}],"words":203,"recite":false},{"id":"bx-144r6vv","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Is it necessary to include natural spaces in city?","question":"Is it necessary to include natural spaces in city?","sentences":["Incorporating natural spaces into cities is not merely a luxury but a necessity,","as explained by the concept of biophilic urbanism.","Humans have an innate tendency to seek connections with nature, and fulfilling this need within urban settings yields profound benefits.","From a material standpoint, green infrastructure such as pocket parks, urban forests,","and green roofs mitigates the heat-island effect, improves air quality, and provides habitats for urban wildlife.","Cognitively, access to nature reduces stress, enhances concentration, and fosters a sense of community among residents.","For instance, neighbours who meet during gardening activities often develop stronger social bonds, combating the isolation common in modern cities.","At a macro level, biophilic design contributes to sustainable urban development by lowering public health costs and increasing property values.","While some critics worry about the land costs, the long-term gains in citizen well-being far outweigh the initial investments.","Moreover, green spaces can be creatively integrated into existing structures, such as vertical gardens on building facades.","Ultimately, a city that embraces nature is a city that cares for its people.","By harmonizing concrete with canopies, we create resilient, livable environments where both humans and ecosystems thrive."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"contribute to","zh":"促成，有助于","src":"At a macro level, biophilic design contributes to sustainable urban development by lowering public health costs and increasing property values.","label":"整理"},{"g":"phrase","en":"access to","zh":"获得……的途径","src":"Cognitively, access to nature reduces stress, enhances concentration, and fosters a sense of community among residents.","label":"整理"},{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"Cognitively, access to nature reduces stress, enhances concentration, and fosters a sense of community among residents.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While some critics worry about the land costs, the long-term gains in citizen well-being far outweigh the initial investments.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, biophilic design contributes to sustainable urban development by lowering public health costs and increasing property values.","label":"整理"},{"g":"pattern","en":"By doing…, …","zh":"通过做……","src":"At a macro level, biophilic design contributes to sustainable urban development by lowering public health costs and increasing property values.","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance, neighbours who meet during gardening activities often develop stronger social bonds, combating the isolation common in modern cities.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, a city that embraces nature is a city that cares for its people.","label":"整理"}],"words":191,"recite":false},{"id":"bx-1b7gbxo","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Are people who live in natural places more likely to prot…","question":"Are people who live in natural places more likely to protect?","sentences":["People who live in close proximity to natural environments are often more inclined to protect them,","a phenomenon well-documented by place attachment theory in environmental sociology.","This theory suggests that emotional bonds formed through long-term residence and daily interaction with a landscape foster a deep sense of stewardship.","Materially, these individuals rely directly on local resources—clean water, fertile soil, and fresh air—for their livelihoods,","making conservation a matter of survival.","Cognitively, they develop a \"sense of place\" that transcends abstract environmental knowledge;","the forest is not just a carbon sink but a childhood playground and a source of family stories.","For example, indigenous communities often act as frontline defenders of biodiversity because their cultural identity is intertwined with the land.","At a macro level, such grassroots efforts complement global environmental policies, proving that local actions have worldwide significance.","However, it is important to note that anyone, regardless of residence, can cultivate this attachment through education and recreation.","While urban dwellers may feel less immediate connection, initiatives like community gardens can bridge the gap.","Ultimately,","nurturing place attachment in all citizens is key to building a sustainable future where every person feels responsible for protecting our shared planet."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"get some fresh air","zh":"呼吸新鲜空气","src":"Materially, these individuals rely directly on local resources—clean water, fertile soil, and fresh air—for their livelihoods,","label":"整理"},{"g":"phrase","en":"regardless of the circumstances","zh":"无论情况如何","src":"However, it is important to note that anyone, regardless of residence, can cultivate this attachment through education and recreation.","label":"整理"},{"g":"phrase","en":"bridge the gap","zh":"缩小差距","src":"While urban dwellers may feel less immediate connection, initiatives like community gardens can bridge the gap.","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"the forest is not just a carbon sink but a childhood playground and a source of family stories.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While urban dwellers may feel less immediate connection, initiatives like community gardens can bridge the gap.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, such grassroots efforts complement global environmental policies, proving that local actions have worldwide significance.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, these individuals rely directly on local resources—clean water, fertile soil, and fresh air—for their livelihoods,","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately,","label":"整理"}],"words":197,"recite":false},{"id":"bx-j55jjv","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"Which group pays more attention to health, young people o…","question":"Which group pays more attention to health, young people or old people?","sentences":["The question of whether young people or old people pay more attention to health can be illuminated by the life-course health model.","This perspective reveals that health focus shifts across the lifespan, with each age group prioritizing different aspects.","Young adults often emphasize physical vitality, appearance, and performance—they frequent gyms, monitor calorie intake, and seek active social lives.","This is driven by a desire for self-expression and long-term habit formation.","Conversely, older adults typically concentrate on disease prevention, functional independence, and mental well-being.","They may schedule regular check-ups, manage chronic conditions, and engage in gentle exercises like tai chi.","Cognitively, youth health pursuits are linked to optimism and future planning,","while elderly health behaviours stem from a need for security and life satisfaction.","At a macro level, societies must address both: youth health programs prevent future burdens, while geriatric care supports aging populations.","Neither group is inherently more health-conscious; rather, they respond to distinct life-stage challenges.","For instance, a teenager might run a marathon for fun, whereas a retiree might walk daily to maintain mobility.","Ultimately, a harmonious society values and supports the health journeys of all ages,","recognizing that every stage of life deserves tailored care and encouragement."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"for fun","zh":"为了好玩","src":"For instance, a teenager might run a marathon for fun, whereas a retiree might walk daily to maintain mobility.","label":"整理"},{"g":"phrase","en":"stem from","zh":"源于","src":"while elderly health behaviours stem from a need for security and life satisfaction.","label":"整理"},{"g":"phrase","en":"mental health/wellbeing","zh":"心理健康","src":"Conversely, older adults typically concentrate on disease prevention, functional independence, and mental well-being.","label":"整理"},{"g":"pattern","en":"… is (largely) determined by…","zh":"……（主要）由……决定","src":"This is driven by a desire for self-expression and long-term habit formation.","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, societies must address both: youth health programs prevent future burdens, while geriatric care supports aging populations.","label":"整理"},{"g":"pattern","en":"Ultimately/Therefore, …（结论句）","zh":"归根结底/因此……","src":"Ultimately, a harmonious society values and supports the health journeys of all ages,","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance, a teenager might run a marathon for fun, whereas a retiree might walk daily to maintain mobility.","label":"整理"},{"g":"idiom","en":"emphasise → stress","zh":"强调（口语替换）","src":"Young adults often emphasize physical vitality, appearance, and performance—they frequent gyms, monitor calorie intake, and seek active social lives.","label":"整理"}],"words":199,"recite":false},{"id":"bx-154m225","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What effect does stress have on health?","question":"What effect does stress have on health?","sentences":["The effects of stress on health are multifaceted, best understood through the stress-inoculation and growth model in positive psychology.","This model distinguishes between \"eustress\" (beneficial stress) and \"distress\" (harmful stress).","In the short term, moderate stress can enhance alertness, boost immune function,","and improve performance—like the focused energy before a presentation.","Materially, this is beneficial, preparing the body for challenges.","However, chronic, unmanaged stress triggers prolonged cortisol release, leading to high blood pressure, weakened immunity,","and mental health issues such as anxiety or depression.","Cognitively, while acute stress can foster resilience and problem-solving skills, toxic stress impairs memory and emotional regulation.","At a macro level, workplaces and schools are increasingly adopting wellness programs that teach coping strategies,","recognizing that stress management is a public health priority.","Importantly, individuals who cultivate mindfulness, social support, and a growth mindset can transform stressful experiences into opportunities for personal development.","For example, overcoming a difficult project at work might not only build professional competence but also increase self-confidence.","Ultimately, stress itself is not inherently negative; it is our response to it that determines its impact.","By building adaptive resources, we can harness stress as a catalyst for growth rather than a source of harm."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"foster sth.","zh":"培养，促进","src":"Cognitively, while acute stress can foster resilience and problem-solving skills, toxic stress impairs memory and emotional regulation.","label":"整理"},{"g":"phrase","en":"cultivate sth.","zh":"培养","src":"Importantly, individuals who cultivate mindfulness, social support, and a growth mindset can transform stressful experiences into opportunities for personal development.","label":"整理"},{"g":"phrase","en":"enhance sth.","zh":"提升","src":"In the short term, moderate stress can enhance alertness, boost immune function,","label":"整理"},{"g":"pattern","en":"not just A, but (also) B","zh":"不仅是A，更是B","src":"For example, overcoming a difficult project at work might not only build professional competence but also increase self-confidence.","label":"整理"},{"g":"pattern","en":"A rather than B","zh":"是A而不是B","src":"By building adaptive resources, we can harness stress as a catalyst for growth rather than a source of harm.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"Cognitively, while acute stress can foster resilience and problem-solving skills, toxic stress impairs memory and emotional regulation.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, this is beneficial, preparing the body for challenges.","label":"整理"},{"g":"idiom","en":"Ultimately → At the end of the day,","zh":"归根结底（口语替换）","src":"Ultimately, stress itself is not inherently negative; it is our response to it that determines its impact.","label":"整理"}],"words":200,"recite":false},{"id":"bx-1979brc","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What kind of things do people usually lose?","question":"What kind of things do people usually lose?","sentences":["The items people commonly lose can be explained by the cognitive load and attention economy model.","In today’s fast-paced, information-saturated world, our brains are constantly juggling multiple tasks, leaving little room for monitoring trivial objects.","Consequently, small, frequently used items like keys, smartphones, wallets, and umbrellas are most prone to being misplaced.","Materially, these objects are often set down absentmindedly during transitions—such as tossing keys on a counter while answering a call.","Cognitively, this reflects \"goal neglect,\" where the primary task (e.g.,","rushing to a meeting) overrides the secondary task of remembering an item’s location.","For instance, a student might lose a pen while deeply focused on solving a complex equation.","At a macro level, the rise of the attention economy—where apps and advertisements compete for our mental bandwidth—exacerbates this issue.","However, technology also offers solutions: Bluetooth trackers and smart labels are becoming popular tools for mitigating such losses.","While some might argue that losing things is a sign of carelessness,","it is more accurately a byproduct of modern life’s cognitive demands.","By understanding these patterns, we can design better habits, like creating designated spots for essentials.","Ultimately,","occasional loss is a universal human experience that reminds us to slow down and practice mindfulness in our daily routines."],"expressions":[],"ai":false,"summary":[{"g":"phrase","en":"focus on","zh":"专注于","src":"For instance, a student might lose a pen while deeply focused on solving a complex equation.","label":"整理"},{"g":"pattern","en":"While A, B","zh":"虽然/而A，B（对比）","src":"While some might argue that losing things is a sign of carelessness,","label":"整理"},{"g":"pattern","en":"At a … level, …","zh":"在……层面上","src":"At a macro level, the rise of the attention economy—where apps and advertisements compete for our mental bandwidth—exacerbates this issue.","label":"整理"},{"g":"pattern","en":"By doing…, …","zh":"通过做……","src":"By understanding these patterns, we can design better habits, like creating designated spots for essentials.","label":"整理"},{"g":"idiom","en":"Materially, → On the practical side,","zh":"从物质层面（口语改写）","src":"Materially, these objects are often set down absentmindedly during transitions—such as tossing keys on a counter while answering a call.","label":"整理"},{"g":"idiom","en":"For instance → Say,","zh":"比如（口语替换）","src":"For instance, a student might lose a pen while deeply focused on solving a complex equation.","label":"整理"}],"words":208,"recite":false},{"id":"bx-eo9hxp","src":"主题素材与提纲","srcDoc":"主题输入素材 · P3 范文","part":"P3","topic":"What will people do when losing things?","question":"What will people do when losing things?","sentences":["When people lose things, their reactions follow a predictable pattern described by the problem-focused coping and emotion regulation model.","Initially, there is an emotional response—often frustration, panic, or self-blame—as the loss is recognized.","This is a natural human reaction to unexpected disruption.","Almost immediately, however, most individuals shift into problem-solving mode.","Materially, they might retrace their steps, search common areas, or use technological aids like \"Find My Phone\" features.","For example, a person who misplaces their wallet will likely chec
